name: adicara

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adicara}
      POSTGRES_USER: ${POSTGRES_USER:-adicara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adicara-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://adicara:adicara-local@postgres:5432/adicara?sslmode=disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: ${APP_ENV:-development}
      # Empty means "use the backend default". The default JWT secret is only
      # accepted while APP_ENV is a development value.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/adicara-api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      API_BASE_URL: http://backend:8080
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/adicara.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:

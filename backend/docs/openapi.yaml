    get:
      tags: [Planner Finance]
      summary: Cash flow summary
      operationId: plannerGetCashflow
      description: >-
        Collected, paid, available cash, what is still owed and the cash deficit.
        `remaining_debt` adds up the positive part of every line, so an overpaid line never
        hides what another still owes.
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerCashflowSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'


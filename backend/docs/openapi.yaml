    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Finance]
      summary: Reorder the budget lines
      operationId: plannerReorderBudgetItems
      description: '`ids` lists every line of the project exactly once.'
      responses:
        '200':
          description: The lines in the new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetLineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived) or `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid

  /v1/planner/projects/{projectId}/budget/items/{budgetItemId}:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerBudgetItemId'
    put:
      tags: [Planner Finance]
      summary: Replace a budget line
      operationId: plannerUpdateBudgetItem
      description: >-
        Replaces the whole line: an optional field that is not sent is cleared, an omitted
        `vendor_id` releases the vendor. Payments, `source`, `item_key` and the document link
        stay. A rollup line keeps its pricing and estimate. Moving a line to a session that
        already has its `item_key` makes it keyless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerBudgetItemRequest'
      responses:
        '200':
          description: The line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`vendor_already_linked`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Planner Finance]
      summary: Delete a budget line
      operationId: plannerDeleteBudgetItem
      description: >-
        The payments go with it; shopping items and documents that pointed at the line keep
        their figures and lose the link.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/budget/items/{budgetItemId}/payment:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerBudgetItemId'
    patch:
      tags: [Planner Finance]
      summary: Record a payment
      operationId: plannerRecordPayment
      description: >-
        Writes one stage. `full` pays the remainder into the first empty stage (`400
        invalid_stage` when none is left or nothing remains). An overpayment is allowed. A
        rollup line cannot be paid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerPaymentRequest'
      responses:
        '200':
          description: The line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`rollup_locked`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/budget/items/{budgetItemId}/payment/{stage}:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerBudgetItemId'
      - name: stage
        in: path
        required: true
        description: '`dp`, `term_1` or `term_2`.'
        schema:
          type: string
          enum: [dp, term_1, term_2]
    delete:
      tags: [Planner Finance]
      summary: Take back a payment
      operationId: plannerClearPayment
      description: 'Empties one stage (amount 0, no date, no receipt).'
      responses:
        '200':
          description: The line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`rollup_locked`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/budget/apply-template:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Finance]
      summary: Apply the budget template
      operationId: plannerApplyBudgetTemplate
      description: >-
        `append` adds the lines whose session and `item_key` are not there yet.
        `replace_template` first deletes the template lines that have no payment; it needs
        `confirm` when one of them holds an estimate, a vendor, a document or a shopping link. A
        wedding gets 14 lines with estimate 0; other event types get percentage lines sized from
        `target_budget`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerApplyTemplateRequest'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerApplyTemplateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`budget_item_limit_reached`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/budget/export:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Finance]
      summary: Export the budget as .xlsx
      operationId: plannerExportBudget
      description: >-
        Three sheets: Rekap (the session matrix), Anggaran (one block per session) and Tabungan
        (the monthly deposits). Every line of the project, not a filtered list. Text that starts
        with `=`, `+`, `-` or `@` is prefixed with an apostrophe. Limited to 10 per minute per
        user. Works on an archived project.
      parameters:
        - name: format
          in: query
          description: >-
            Optional. `xlsx` is the default and the only format; any other value answers
            `400 invalid_input` (`format: must be xlsx`).
          required: false
          schema:
            type: string
            enum: [xlsx]
            default: xlsx
      responses:
        '200':
          description: The workbook.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="keuangan-contoh-pernikahan-sinta-arif-2026-10-04.xlsx"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/vendors:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Vendor]
      summary: List the vendors
      operationId: plannerListVendors
      description: >-
        The vendors in display order with the limit of each, plus the KPI, the checklist of
        categories and the limit groups. The KPI, the categories and the groups always describe
        the whole project; only `vendors` is filtered. The limit of a vendor is read from the
        active scenario every time, so it never goes stale: its own session is tried first and
        then `all`.
      parameters:
        - name: scope
          in: query
          description: 'Empty = every session, `all` = the general vendors only, any other `scope_key` = that session.'
          schema:
            type: string
        - name: status
          in: query
          description: 'One of the four statuses.'
          schema:
            type: string
            enum: [rencana, negosiasi, fix, batal]
        - name: category
          in: query
          description: 'A `category_key`.'
          schema:
            type: string
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerVendorOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    post:
      tags: [Planner Vendor]
      summary: Add a vendor
      operationId: plannerCreateVendor
      description: >-
        A candidate (status `rencana` unless the body says otherwise). `category_key` is a key
        of `vendor_categories` of the event type, or empty for a custom category, whose key is
        derived from `category_label`. At most 200 per project. `phone_number` is kept as typed
        and `formatted_wa_number` (62...) is derived from it; only Indonesian numbers are
        accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerVendorRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerVendorResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`vendor_limit_reached`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/vendors/export-contacts:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Vendor]
      summary: Export the contacts of the fixed vendors as .xlsx
      operationId: plannerExportVendorContacts
      description: >-
        One sheet, "Kontak Vendor": the vendors with status `fix`, in order, with the contact
        only (no price, limit or note: the sheet goes to the organiser or the committee). Text
        that starts with `=`, `+`, `-` or `@` is prefixed with an apostrophe. Limited to 10
        requests per minute per user, shared with the shopping export. Works on an archived
        project.
      parameters:
        - name: format
          in: query
          description: >-
            Optional. `xlsx` is the default and the only format; any other value answers
            `400 invalid_input` (`format: must be xlsx`).
          required: false
          schema:
            type: string
            enum: [xlsx]
            default: xlsx
      responses:
        '200':
          description: The workbook.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="vendor-contoh-pernikahan-sinta-arif-2026-10-04.xlsx"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/vendors/{vendorId}:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerVendorId'
    get:
      tags: [Planner Vendor]
      summary: Get a vendor
      operationId: plannerGetVendor
      description: >-
        The vendor with its limit and the payment of the line that points at it.
      responses:
        '200':
          description: The vendor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerVendor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    put:
      tags: [Planner Vendor]
      summary: Replace a vendor
      operationId: plannerUpdateVendor
      description: >-
        Replaces the vendor entirely. The estimate of the linked budget line is never changed
        here (only lock-deal does that). A deal that moved away from the estimate of the linked
        line answers `estimate_differs`; leaving `fix` releases the line and answers
        `budget_link_released`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerVendorRequest'
      responses:
        '200':
          description: The vendor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerVendorResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Planner Vendor]
      summary: Delete a vendor
      operationId: plannerDeleteVendor
      description: >-
        Tasks, budget lines, shopping items and agendas that point at the vendor keep existing
        with an empty vendor.
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/vendors/{vendorId}/status:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerVendorId'
    patch:
      tags: [Planner Vendor]
      summary: Move a vendor in the pipeline
      operationId: plannerSetVendorStatus
      description: >-
        `fix` needs `agreed_price` above 0 (`invalid_input`, `agreed_price: must be greater than
        0 when status is fix`). Leaving `fix` releases the budget line and answers
        `budget_link_released`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerVendorStatusRequest'
      responses:
        '200':
          description: The vendor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerVendorResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/vendors/{vendorId}/lock-deal:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerVendorId'
    post:
      tags: [Planner Vendor]
      summary: Lock a deal
      operationId: plannerLockVendorDeal
      description: >-
        The vendor becomes `fix` with the agreed price. With `sync_to_budget_items` the deal is
        also tied to the budget, never making a second line for the same cost: the line that
        already points at the vendor is re-priced; a line that several categories share is
        reported in `shared_item` and left alone; the dedicated line of the category (its
        session first, then `all`) is linked and takes the deal as estimate; otherwise a new
        line is made (name cut to 150 characters). A line priced per unit keeps quantity x unit
        price (`unit_pricing`). The whole call runs under the project lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerLockDealRequest'
      responses:
        '200':
          description: The vendor and what happened to the budget.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerLockDealResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`budget_item_limit_reached` (a new line would pass 300), `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/shopping-items:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Vendor]
      summary: List the shopping items
      operationId: plannerListShoppingItems
      description: >-
        The items in order, plus the KPI, the budget lines that roll the list up and the default
        line for "compute the line from this list". The KPI, the rollups and the default line
        describe the whole project; only `items` is filtered.
      parameters:
        - name: scope
          in: query
          description: 'Empty = every session, `all` = the general items only, any other `scope_key` = that session.'
          schema:
            type: string
        - name: category
          in: query
          description: 'The category text exactly as stored.'
          schema:
            type: string
        - name: status
          in: query
          description: 'One of the three statuses.'
          schema:
            type: string
            enum: [belum, proses, selesai]
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerShoppingOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    post:
      tags: [Planner Vendor]
      summary: Add a shopping item
      operationId: plannerCreateShoppingItem
      description: >-
        At the end of the order; at most 1000 per project. `quantity` (0.01 to 1000000, two
        decimals) defaults to 1 and the prices are per unit; `quantity x price` must not exceed
        10^13 (`invalid_input`, never a 500). `budget_item_id` names a line that already rolls
        up the list; an item made without it stays out of that line until it is linked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerShoppingItemRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerShoppingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`shopping_item_limit_reached`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/shopping-items/apply-template:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Vendor]
      summary: Apply the shopping template
      operationId: plannerApplyShoppingTemplate
      description: >-
        Only the wedding has a template (37 seserahan items); other event types answer
        `invalid_template`. The wizard runs `append`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerShoppingTemplateRequest'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerShoppingTemplateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`shopping_item_limit_reached`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/shopping-items/link-to-budget:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Vendor]
      summary: Compute a budget line from the shopping list
      operationId: plannerLinkShoppingToBudget
      description: >-
        Switches the rollup of a line on and points the items at it. The line becomes
        `rollup_source: shopping` and the view sums its items: the total is never copied. A line
        that already holds stored payments ignores them while it rolls up: that needs `confirm`
        (`409 rollup_conflict`). A line priced per unit or held by a vendor or a document is
        refused. Without `budget_item_id` the default line of the event type is used (the
        fallback line `perlengkapan` when the default one cannot roll up), and made when it does
        not exist. Items that already point at another line stay there. Idempotent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerLinkToBudgetRequest'
      responses:
        '200':
          description: The line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerLinkToBudgetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`rollup_conflict`, `budget_item_limit_reached` (the line to make would pass 300), `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/shopping-items/unlink-from-budget:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Vendor]
      summary: Stop computing a budget line from the shopping list
      operationId: plannerUnlinkShoppingFromBudget
      description: >-
        Releases every item from the line and switches the rollup off: the line goes back to the
        figures stored in it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerUnlinkFromBudgetRequest'
      responses:
        '200':
          description: How many items were released.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerUnlinkFromBudgetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /v1/planner/projects/{projectId}/scenarios/apply:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Finance]
      summary: Apply a scenario
      operationId: plannerApplyScenario
      description: >-
        Makes the scenario the active one and lays it over the budget lines in one transaction.
        `smart_adjust` sets estimates only (payments, vendors and documents stay; rollup and
        unit-priced lines are skipped; applying twice changes nothing). `clean_overwrite`
        deletes every line and its payments first and needs `confirm: RESET`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerApplyScenarioRequest'
      responses:
        '200':
          description: What was done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerApplyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: >-
            `budget_item_limit_reached` (the result would exceed 300 lines), `project_read_only`
            (the project is archived), `conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/playlists/apply-template:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Rundown]
      summary: Apply the playlist template
      operationId: plannerApplyPlaylistTemplate
      description: >-
        Only the wedding has a template (30 songs, each `digital_playback` and `needs_review`, with a suggested moment tag); other types answer `400 invalid_template`. The playlist only appends: `mode: replace_template` is `400 invalid_input` (`mode`), because a reset would overwrite the format, the cue and the status the user filled in.

    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Finance]
      summary: Budget matrix by session
      operationId: plannerGetBudgetMatrix
      description: >-
        KPI, one row per session that has lines (the general session last), their total, and the
        active scenario with what it leaves unallocated.
      responses:
        '200':
          description: The matrix.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetMatrix'
        '401':
          $ref: '#/components/responses/Unauthorized'

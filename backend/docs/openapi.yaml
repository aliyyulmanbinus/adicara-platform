  /v1/planner/projects/{projectId}/guests/catering-projection:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Guest]
      summary: Portions for the caterer
      operationId: plannerGuestCateringProjection
      description: >-
        Only attending guests count; guests who declined never do. Nothing is saved and the budget is not touched: the client
        fills the quantity of a unit-priced budget line (menu 03) when the user asks.
      parameters:
        - name: buffer_percent
          in: query
          description: 'Whole percent, default 25.'
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 25
        - name: buffer_pax
          in: query
          description: 'Extra portions, default 0.'
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
      responses:
        '200':
          description: The projection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerCateringProjection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'

  /v1/planner/projects/{projectId}/guests/export:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Guest]
      summary: Export the guest list as .xlsx
      operationId: plannerExportGuests
      description: >-
        One sheet, "Daftar Tamu": every guest in order with the ticket code (so the owner can print QR codes with a tool of
        their own) and a TOTAL row. Text that starts with `=`, `+`, `-` or `@` is prefixed with an apostrophe. Limited to 10
        requests per minute per user, shared with the attendance sheet and the template. Works on an archived project.
      parameters:
        - name: format
          in: query
          description: >-
            Optional. `xlsx` is the default and the only format; any other value answers
            `400 invalid_input` (`format: must be xlsx`).
          required: false
          schema:
            type: string
            enum: [xlsx]
            default: xlsx
      responses:
        '200':
          description: The workbook.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="tamu-contoh-pernikahan-sinta-arif-2026-10-04.xlsx"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/guests/import-template:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Guest]
      summary: The empty import file as .xlsx
      operationId: plannerGuestImportTemplate
      description: >-
        Sheet "Tamu" holds the header row the import recognises and no sample row; sheet "Petunjuk" lists the sides, the
        categories and the sessions of the project (the dropdowns point there) and explains the columns. The word for a
        guest ("Tamu" or "Peserta") and the Pihak column follow the event type. Same limit as the other downloads.
      parameters:
        - name: format
          in: query
          description: >-
            Optional. `xlsx` is the default and the only format; any other value answers
            `400 invalid_input` (`format: must be xlsx`).
          required: false
          schema:
            type: string
            enum: [xlsx]
            default: xlsx
      responses:
        '200':
          description: The workbook.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="templat-tamu-contoh-pernikahan-sinta-arif-2026-10-04.xlsx"'
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/guests/bulk-import:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Guest]
      summary: Import guests from a .csv or .xlsx file
      operationId: plannerBulkImportGuests
      description: >-
        The file travels as JSON (`filename`, `content_base64`): the BFF forwards JSON only. Columns are found by header
        (Nama Tamu or Nama Peserta, Pihak, Kategori, Sesi, No Meja, Pax, No WhatsApp, Catatan); only the name is required.
        A CSV may be UTF-8 (with or without BOM) or Windows-1252 and use a comma, a semicolon or a tab. A phone number
        without a prefix (Excel drops the leading 0) is refused, not guessed. Duplicates (same name and WhatsApp number) are
        reported and still imported unless `skip_duplicates`. With `dry_run` nothing is written. A real import is one
        transaction: rows with errors refuse the whole file (`invalid_input`, `rows: N rows are invalid`) unless
        `skip_invalid`. At most 2.000 rows and 5 MiB; 5 requests per minute per user (a dry run counts).
      parameters:
        - name: dry_run
          in: query
          description: '`true` or `false` (default).'
          schema:
            type: boolean
            default: false
        - name: skip_invalid
          in: query
          description: '`true` or `false` (default).'
          schema:
            type: boolean
            default: false
        - name: skip_duplicates
          in: query
          description: '`true` or `false` (default).'
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerGuestImportRequest'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerGuestImportResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`guest_limit_reached` (5.000 guests per project), `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`file_too_large`: the file is over 5 MiB once decoded, or the body over 7.5 MiB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/guests/reception-overview:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Guest]
      summary: The reception desk
      operationId: plannerReceptionOverview
      description: >-
        One packet for one polling cycle of 5 seconds: the KPI, the filter counts, the 10 newest check-ins and one page of the
        queue. The queue shows the expected guests (not declined, or declined but came); `status=in` the guests who came,
        newest first; `status=pending` the ones still outside. A `search` also reaches guests who declined and have not come.
      parameters:
        - name: status
          in: query
          description: 'default `all`'
          schema:
            type: string
            enum: [all, in, pending]
            default: all
        - name: category
          in: query
          description: 'A category key or free text, 60 characters at most.'
          schema:
            type: string
        - name: search
          in: query
          description: 'At most 100 characters after trimming.'
          schema:
            type: string
        - name: limit
          in: query
          description: 'default 50, 1 to 200'
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: 'default 0'
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The packet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerReceptionOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'


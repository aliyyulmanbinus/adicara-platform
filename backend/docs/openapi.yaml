        checked in cannot be changed (`already_checked_in`): cancel the check-in first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerGuestRSVPRequest'
      responses:
        '200':
          description: The guest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerGuest'

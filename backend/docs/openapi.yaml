    get:
      tags: [Planner Rundown]
      summary: The sound cue briefing as a WhatsApp message
      operationId: plannerExportPlaylistWA
      description: >-
        For the soundman or the band: songs tied to an agenda grouped by session and agenda in clock order, then the songs without an agenda grouped by moment tag, each with its format and cue. Limited to 10 requests per minute per user, shared with the rundown message. Works on an archived project.
      responses:
        '200':
          description: The text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerWAExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':

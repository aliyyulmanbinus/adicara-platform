  /v1/planner/projects/{projectId}/guests:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Guest]
      summary: List the guests
      operationId: plannerListGuests
      description: >-
        One page of the guests that match the filters, in the order they were made (imports keep the order of the file),
        and the `overview` of the whole project. Search is a substring match on name, table number, the phone number as
        typed and its 62... form (`%` and `_` mean themselves).
      parameters:
        - name: side
          in: query
          description: 'A key of `guest_sides`, or `none` for guests whose side is not decided.'
          schema:
            type: string
        - name: category
          in: query
          description: 'A category key or free text, 60 characters at most.'
          schema:
            type: string
        - name: rsvp
          in: query
          description: 'An RSVP status.'
          schema:
            type: string
            enum: [unconfirmed, attending, declined, maybe]
        - name: sent
          in: query
          description: '`sent` (sent or delivered) or `unsent`.'
          schema:
            type: string
            enum: [sent, unsent]
        - name: scope
          in: query
          description: 'A `scope_key` of a session of the project.'
          schema:
            type: string
        - name: search
          in: query
          description: 'At most 100 characters after trimming.'
          schema:
            type: string
        - name: limit
          in: query
          description: 'default 100, 1 to 500'
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          description: 'default 0'
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The page and the overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerGuestList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    post:
      tags: [Planner Guest]
      summary: Add a guest
      operationId: plannerCreateGuest
      description: >-
        A guest nobody has answered or visited yet, with a new ticket token. At most 5.000 per project (checked under the
        project lock).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerGuestRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerGuest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`guest_limit_reached` (5.000 guests per project), `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/guests/summary:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Guest]
      summary: The guest figures of the whole project
      operationId: plannerGuestSummary
      description: >-
        The `overview` alone (light; polled every 30 seconds). The `guests` widget of the dashboard is built from the same figures.
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerGuestOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':

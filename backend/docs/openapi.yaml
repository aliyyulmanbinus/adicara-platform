  /v1/planner/projects/{projectId}/budget/items:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Finance]
      summary: List the budget lines
      operationId: plannerListBudgetItems
      description: >-
        Lines in `sort_order` with their effective figures. No `scope` = every session;
        `scope=all` = the general lines only; any other `scope_key` = that session.
      responses:
        '200':
          description: The lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetLineList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
      parameters:
        - name: scope
          in: query
          description: 'A `scope_key`.'
          schema:
            type: string
    post:
      tags: [Planner Finance]
      summary: Add a budget line
      operationId: plannerCreateBudgetItem
      description: >-
        A line the user made (source `manual`, no `item_key`), at the end of the order. At most
        300 per project. A `unit` line has its estimate worked out from quantity x unit price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerBudgetItemRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerBudgetLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: >-
            `budget_item_limit_reached`, `vendor_already_linked`, `project_read_only` (the project
            is archived), `conflict`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


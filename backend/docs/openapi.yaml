        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`task_limit_reached`, `project_read_only` (the project is archived) or `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/tasks/export-spreadsheet:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Timeline]
      summary: Export the schedule as .xlsx
      operationId: plannerExportTasks
      description: >-
        All tasks of the project (not a filtered list) and a weekly Gantt matrix. Text that
        starts with `=`, `+`, `-` or `@` is prefixed with an apostrophe. Limited to 10 per minute
        per user. Works on an archived project.
      parameters:
        - name: format
          in: query
          description: >-
            Optional. `xlsx` is the default and the only format; any other value answers
            `400 invalid_input` (`format: must be xlsx`).
          required: false
          schema:
            type: string
            enum: [xlsx]
            default: xlsx
      responses:
        '200':
          description: The workbook.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="jadwal-contoh-pernikahan-sinta-arif-2026-10-04.xlsx"
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


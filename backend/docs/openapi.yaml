          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerRundown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`agenda_limit_reached`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/rundowns/summary:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Rundown]
      summary: Live status of the rundown
      operationId: plannerRundownLive
      description: >-
        The status of every agenda, the KPI and the sessions, and the server clock. The event-day screen polls it every 5 seconds; it is not rate limited (several tablets may share one account).
      responses:
        '200':
          description: The live status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerRundownLive'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'

  /v1/planner/projects/{projectId}/rundowns/reorder:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Rundown]
      summary: Reorder the agendas of a session
      operationId: plannerReorderRundowns
      description: >-
        `ids` must be exactly the agendas of the session, each once; anything else is `400 invalid_input` (`ids`) and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerRundownReorderRequest'
      responses:
        '204':
          description: Reordered.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/rundowns/apply-template:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Rundown]
      summary: Apply the rundown template
      operationId: plannerApplyRundownTemplate
      description: >-
        Every event type has a rundown template in the sessions its registry seeds (the wedding: 11 + 8 + 14 agendas). A session the user has deleted is skipped with the warning `scope_missing`.
        `append` (default, also what the wizard runs) adds the agendas whose `template_key` is not there yet. `replace_template` puts the template agendas that are still `pending` back to the template, in place (id, vendor, session and linked songs stay); running and done ones are `kept`, agendas of the user are not touched. It needs `confirm: true` when it resets anything (`400 invalid_input`, `confirm`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerRundownTemplateRequest'
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerRundownTemplateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`agenda_limit_reached` (nothing is created), `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/rundowns/export-wa:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Rundown]
      summary: The rundown as a WhatsApp message
      operationId: plannerExportRundownWA
      description: >-
        The text of one session (`?session_id=`) or of every session that has agendas: title, date, place, then each agenda with its time, duration, PIC, description and highlights. Limited to 10 requests per minute per user, shared with the playlist briefing. Works on an archived project.
      parameters:
        - name: session_id
          in: query
          required: false
          description: A non-system session of the project; anything else is `400 invalid_scope` (the system session `all` is `400 invalid_input`).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerWAExport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/rundowns/{rundownId}:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerRundownId'
    get:
      tags: [Planner Rundown]
      summary: Get an agenda
      operationId: plannerGetRundown
      description: >-
        One agenda with its vendor and the number of songs tied to it.
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerRundown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    put:
      tags: [Planner Rundown]
      summary: Replace an agenda
      operationId: plannerUpdateRundown
      description: >-
        Replaces everything but the status, the time stamps and the template key. An agenda moved to another session goes last there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerRundownRequest'
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerRundown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Planner Rundown]
      summary: Delete an agenda
      operationId: plannerDeleteRundown
      description: >-
        The songs that pointed at the agenda stay, without a link.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/rundowns/{rundownId}/status:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerRundownId'
    patch:
      tags: [Planner Rundown]
      summary: Move an agenda to a status
      operationId: plannerSetRundownStatus
      description: >-
        One statement writes the status and its time stamps: `pending` clears both; `in_progress` sets `started_at` once and clears `completed_at`; `completed` sets both. Sending the same status again changes no time stamp; reopening a done agenda keeps its start. Several agendas may run at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerRundownStatusRequest'
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerRundown'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/playlists:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner Rundown]
      summary: List the songs of the playlist
      operationId: plannerListPlaylists
      description: >-
        Every song in playlist order, with the agenda it is tied to. `kpi` always describes the whole playlist; the filters narrow `items` only. There is no pagination (at most 500 songs) and no search: the client searches.
      parameters:
        - name: moment_tag
          in: query
          required: false
          description: Compared as typed, at most 100 characters.
          schema:
            type: string
        - name: audio_format
          in: query
          required: false
          schema:
            type: string
            enum: [digital_playback, live_band, acoustic, sound_fx]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ready, needs_review, missing_file]
      responses:
        '200':
          description: The playlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerPlaylistOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    post:
      tags: [Planner Rundown]
      summary: Add a song
      operationId: plannerCreatePlaylist
      description: >-
        The song goes last. At most 500 songs per project (`409 playlist_limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerPlaylistRequest'
      responses:
        '201':
          description: The song.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerPlaylist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`playlist_limit_reached`, `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/playlists/reorder:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Rundown]
      summary: Reorder the songs
      operationId: plannerReorderPlaylists

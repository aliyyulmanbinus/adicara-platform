      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner Timeline]
      summary: Generate the schedule from a template
      operationId: plannerGenerateTasks
      description: >-
        Scales the offsets of the template to the time left before Hari-H (never before today or
        `prep_start_date`) and writes the tasks in one transaction; a refused call changes nothing.
        An event in the past answers `400 invalid_date`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerGenerateRequest'
      responses:
        '200':
          description: Done.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerGenerateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`task_limit_reached`, `project_read_only` (the project is archived) or `conflict`.'
          content:

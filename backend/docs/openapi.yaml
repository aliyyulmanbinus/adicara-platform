          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`playlist_limit_reached` (nothing is created), `project_read_only` (the project is archived), `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/playlists/export-wa:

  /v1/planner/projects/{projectId}/admin-docs/{docId}/sync-budget:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - $ref: '#/components/parameters/PlannerDocId'
    post:
      tags: [Planner Timeline]
      summary: Copy the cost of a document into the budget
      operationId: plannerSyncAdminDocBudget
      description: >-
        Idempotent and never overwrites a figure: an already linked document changes nothing; a
        waiting line with the matching session and `item_key` is linked (and takes the cost when its
        estimate is 0); otherwise a new line in category `Legalitas` is created. The cost must be
        above 0. The sync happens once: later changes to the cost do not reach the line.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerSyncBudgetRequest'
      responses:
        '200':
          description: Nothing new was created (already linked, or an existing line was linked).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerSyncBudgetResult'
        '201':
          description: A new budget line was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerSyncBudgetResult'

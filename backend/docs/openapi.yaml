openapi: 3.0.3
info:
  title: Adicara API
  description: Backend API untuk platform Adicara (Auth, Health, Profile, Planner).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Backend run directly (`go run ./cmd/api`)
  - url: /api
    description: >-
      Same-origin through Nginx (browser, production). Nginx drops the `/api` prefix, so
      `/api/v1/auth/login` reaches the backend as `/v1/auth/login`. Only `/api/v1/*` is
      forwarded; `/healthz` is not under `/api`.

tags:
  - name: Planner
    description: Menu 01 of the Planner service. Every route needs a bearer token.
  - name: Planner Timeline
    description: >-
      Menu 02 of the Planner service: the task timeline and the administrative documents of a
      project. Every route needs a bearer token and goes through the same project guard as
      menu 01 (another user's project is 404; an archived project is read-only, `GET` and the
      export still work).
  - name: Planner Finance
    description: >-
      Menu 03 of the Planner service: the budget simulation (scenarios), the savings and the
      realisation of the budget lines (payments, matrix, cash flow, export). Every route needs a bearer
      token and goes through the same project guard as menu 01 (another user's project is 404; an
      archived project is read-only, `GET` and the export still work).
  - name: Planner Vendor
    description: >-
      Menu 04 of the Planner service: the vendor pipeline (with the limit of each category read from the active
      scenario, and the lock-deal that ties a deal to the budget) and the shopping list (with its rollup into a
      budget line, the template and the exports). Every route needs a bearer token and goes through the same project
      guard as menu 01 (another user's project is 404; an archived project is read-only, `GET` and the exports still work).

  - name: Planner Guest
    description: >-
      Menu 05 of the Planner service: the guest list with RSVP and invitation status, the reception desk of the
      event day (QR scan, check-in, walk-ins, souvenirs), the catering projection, and the import and export of
      the list. Every route needs a bearer token and goes through the same project guard as menu 01 (another
      user's project is 404; an archived project is read-only, `GET`, the exports and the template still work).
      A guest that belongs to the invitation module alone (no project) is never visible here.
  - name: Planner Rundown
    description: >-
      Menu 06 of the Planner service: the rundown of the event (agendas minute by minute per session, with the live
      status of the event day and the WhatsApp text) and the playlist (songs tied to the agendas, with the sound cue
      briefing). The sessions themselves belong to menu 01 (`/sessions`). Every route needs a bearer token and goes
      through the same project guard as menu 01 (another user's project is 404; an archived project is read-only,
      `GET` and the exports still work).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: >-
                Machine-readable. Auth codes: invalid_json, invalid_input, invalid_email,
                invalid_username, weak_password, password_too_long, email_taken,
                username_taken, unauthorized, account_inactive, not_found, rate_limited, internal.
                Planner codes: invalid_metadata, invalid_scope, invalid_date, invalid_timezone,
                invalid_template (400); project_read_only, project_limit_reached,
                session_in_use, session_name_taken, session_limit_reached, conflict (409).
                Timeline codes: task_limit_reached, admin_doc_limit_reached (409).
                Finance codes: invalid_stage (400); max_scenarios_reached, scenario_item_limit_reached,
                budget_item_limit_reached, contributor_limit_reached, savings_entry_limit_reached,
                contributor_in_use, vendor_already_linked, rollup_locked (409).
                Vendor codes: invalid_phone (400); vendor_limit_reached, shopping_item_limit_reached,
                rollup_conflict (409); lock-deal and the rollup also answer budget_item_limit_reached when a
                new line would pass the limit of menu 03.
                Guest codes: invalid_phone, invalid_file (400); file_too_large (413); guest_limit_reached,
                already_checked_in (409).
                Rundown codes: agenda_limit_reached, playlist_limit_reached (409).
              example: weak_password
            message:
              type: string
              description: >-
                English, for logs. Clients should map `code` to their own text. Planner validation
                errors (`invalid_input`, `invalid_metadata`, `invalid_date`, `invalid_timezone`)
                read `<field>: <reason>` so a form can mark the field.
            details:
              type: object
              additionalProperties: true
              description: >-
                Present only where the client needs more to act on the error, e.g.
                `session_in_use` carries `usage` (rows that still point at the session).
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        name:
          type: string
          nullable: true
        role_id:
          type: integer
          example: 2
        status:
          type: string
          example: active
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
    # ---------- Planner (menu 01: projects, sessions, dashboard) ----------
    PhaseInfo:
      type: object
      description: >-
        Computed by the server in the project's own time zone (never from the device clock).
        `upcoming` before `event_date`; `ongoing` from `event_date` to `event_end_date`
        (or `event_date` for a one-day event); `finished` afterwards.
      required: [days_remaining, phase, day_number, total_days]
      properties:
        days_remaining:
          type: integer
          description: Calendar days from today to `event_date`; 0 or negative from Hari-H on.
          example: 175
        phase:
          type: string
          enum: [upcoming, ongoing, finished]
        day_number:
          type: integer
          description: N-th day while `ongoing`, otherwise 0.
        total_days:
          type: integer
          description: 1 for a one-day event.
    PlannerProject:
      allOf:
        - $ref: '#/components/schemas/PhaseInfo'
        - type: object
          required: [id, event_type, title, event_date, prep_start_date, timezone, target_budget, status, is_sample]
          properties:
            id:
              type: string
              format: uuid
            event_type:
              $ref: '#/components/schemas/PlannerEventTypeKey'
            title:
              type: string
              maxLength: 255
            event_date:
              type: string
              format: date
              description: Hari-H (the first day of a multi-day event).
            event_end_date:
              type: string
              format: date
              nullable: true
              description: null = one-day event.
            prep_start_date:
              type: string
              format: date
            timezone:
              type: string
              example: Asia/Jakarta
            target_budget:
              type: integer
              format: int64
              description: Whole rupiah, 0 to 10^13.
            savings_target:
              type: integer
              format: int64
              nullable: true
              description: null = follows `target_budget`.
            status:
              $ref: '#/components/schemas/PlannerProjectStatus'
            is_sample:
              type: boolean
            skipped_vendor_categories:
              type: array
              items:
                type: string
            invitation_id:
              type: string
              format: uuid
              nullable: true
            metadata:
              type: object
              additionalProperties: true
              description: Keys depend on the event type (`GET /v1/planner/event-types`).
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PlannerEventTypeKey:
      type: string
      enum: [wedding, khitanan, aqiqah, peresmian, launching, birthday, wisuda, seminar, other]
    PlannerProjectStatus:
      type: string
      enum: [active, completed, archived]
    PlannerNotice:
      type: object
      required: [code, message, count]
      properties:
        code:
          type: string
          description: >-
            Warnings: `tasks_overdue_after_shift`. Hints: `tasks_not_shifted`,
            `sessions_dates_unchanged`. Template warnings come from the module that owns the
            template: `lead_time_compressed`, `lead_time_too_short`, `scope_fallback` and
            `budget_link_lost` (menus 02 and 03), `estimate_differs` (sync to the budget).
            `scope_fallback` also comes from the budget template and from scenario presets.
            Menu 04: `unit_pricing`, `shared_budget_item` (lock-deal), `budget_link_released` (a vendor left
            `fix`), `estimate_differs` (a vendor update) and `budget_link_lost` (replacing the shopping template).
            Menu 06: `scope_missing` (the agendas of a session that was deleted were skipped; `count` is how many).
        message:
          type: string
        count:
          type: integer
        shift_days:
          type: integer
          description: Only on `tasks_not_shifted`.
    PlannerApplyResult:
      type: object
      properties:
        created:
          type: integer
        skipped:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerTemplatesAvailable:
      type: object
      description: >-
        What the wizard may offer for the event type: templates the type owns AND whose module
        is built. Empty until the other planner modules exist.
      properties:
        timeline_presets:
          type: array
          items:
            type: string
          example: [wedding_pdf_44, wedding_essential_22]
        include_adicara_tasks:
          type: boolean
        admin_docs:
          type: boolean
        budget_lines:
          type: boolean
        shopping_list:
          type: boolean
        rundown:
          type: boolean
        playlist:
          type: boolean
    PlannerEventType:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/PlannerEventTypeKey'
        label:
          type: string
          example: Pernikahan
        icon:
          type: string
          example: "\U0001F48D"
        lead_time_days:
          type: integer
          description: Standard horizon of the timeline template.
        sessions:
          type: array
          description: Default sessions created with every project of this type.
          items:
            type: object
            properties:
              scope_key:
                type: string
              name:
                type: string
              icon:
                type: string
              same_day:
                type: boolean
                description: Born with `session_date` = `event_date`.
        metadata_fields:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              type:
                type: string
                enum: [string, int, date]
              max_len:
                type: integer
              min:
                type: integer
              max:
                type: integer
              required:
                type: boolean
        labels:
          type: object
          properties:
            guest:
              type: string
              example: Tamu
            guest_menu:
              type: string
              example: Buku Tamu & RSVP
        templates_available:
          $ref: '#/components/schemas/PlannerTemplatesAvailable'
        admin_subjects:
          type: array
          description: Subjects a document can be about (filter chips and the role dropdown). Menu 02.
          items:
            type: object
            properties:
              key:
                type: string
                example: ortu_cpp
              label:
                type: string
                example: Orang Tua CPP
        admin_guide:
          type: object
          description: The callout above the document list. Menu 02.
          properties:
            title:
              type: string
              example: Panduan Pengurusan Berkas Nikah
            steps:
              type: array
              description: Exactly four steps, plain text.
              items:
                type: string
        contributor_roles:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
                example: groom
              label:
                type: string
                example: Mempelai Pria
          description: >-
            Roles a savings contributor can have for this event type; every type lists `other` (the
            default). Menu 03.
        vendor_categories:
          type: array
          description: >-
            The vendor checklist of this event type, in order. The line each category is paid from stays
            on the server. Menu 04.
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
                example: catering
              label:
                type: string
                example: Catering
        shopping_categories:
          type: array
          description: >-
            Suggested categories of the shopping list; the category of an item is free text, stored as
            typed. Menu 04.
          items:
            type: string
          example: [Perangkat Alat Solat, Make Up & Skin Care]
        guest_sides:
          type: array
          description: >-
            The sides of the guest list of this event type, in order; empty for a type that does not split
            its guests (birthday, wisuda, other). Menu 05.
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
                example: pria
              label:
                type: string
                example: Pihak Pria (CPP)
        guest_categories:
          type: array
          description: >-
            The categories of the guest list of this event type, in order. Any other text is a free-text
            category; the fallback `lainnya` is not listed. Menu 05.
          items:
            type: object
            required: [key, label]
            properties:
              key:
                type: string
                example: teman_ortu
              label:
                type: string
                example: Teman Orang Tua
        moment_tags:
          type: array
          description: >-
            The audio moment tags this event type suggests for the playlist, in order. A song may carry any other
            text. Menu 06.
          items:
            type: string
            example: Akad Khidmat
    PlannerInitTemplates:
      type: object
      description: >-
        Only what is requested is created. A template the event type does not own, or whose
        module is not built, is refused with `invalid_template`.
      properties:
        timeline_preset:
          type: string
          nullable: true
          example: wedding_pdf_44
        include_adicara_tasks:
          type: boolean
        admin_docs:
          type: boolean
        budget_lines:
          type: boolean
        shopping_list:
          type: boolean
        rundown:
          type: boolean
        playlist:
          type: boolean
    PlannerInitProjectRequest:
      type: object
      required: [event_type, title, event_date]
      properties:
        event_type:
          $ref: '#/components/schemas/PlannerEventTypeKey'
        title:
          type: string
          description: Trimmed; 1 to 255 characters, no control characters.
        event_date:
          type: string
          format: date
          description: Not before today (in the project time zone) and at most 1826 days ahead.
        event_end_date:
          type: string
          format: date
          nullable: true
          description: Not before `event_date`, at most 30 days after it.
        prep_start_date:
          type: string
          format: date
          nullable: true
          description: Default is today in the project time zone; must not be after `event_date`.
        timezone:
          type: string
          nullable: true
          description: Canonical IANA name (`Asia/Jakarta`, `UTC`). Default `Asia/Jakarta`.
        target_budget:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000000
        metadata:
          type: object
          additionalProperties: true
          description: Validated against the registry of the event type.
        templates:
          $ref: '#/components/schemas/PlannerInitTemplates'
        client_token:
          type: string
          minLength: 8
          maxLength: 64
          description: >-
            Generated by the wizard when it opens. Repeating a request with the same token
            returns the original project (`200`, `created: false`) without running templates again.
    PlannerUpdateProjectRequest:
      type: object
      description: >-
        PATCH: only the fields sent change. Because JSON `null` and "not sent" are
        indistinguishable for a plain field, clearing uses the `clear_*` flags.
      properties:
        title:
          type: string
        event_date:
          type: string
          format: date
          description: >-
            Past dates are allowed (correcting data). `event_end_date` moves with it unless it is
            sent too; sessions dated on the old Hari-H follow.
        event_end_date:
          type: string
          format: date
        clear_event_end_date:
          type: boolean
        prep_start_date:
          type: string
          format: date
        timezone:
          type: string
        target_budget:
          type: integer
          format: int64
        savings_target:
          type: integer
          format: int64
        clear_savings_target:
          type: boolean
          description: Back to following `target_budget`.
        skipped_vendor_categories:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
          description: 'JSON Merge Patch: a key is replaced, `null` deletes it, an absent key stays.'
        shift_tasks:
          type: boolean
          description: >-
            Move the template tasks that are not done by the same number of days, in the same
            transaction as the date change. Ignored when the date does not change.
    PlannerProjectCard:
      allOf:
        - $ref: '#/components/schemas/PhaseInfo'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            event_type:
              $ref: '#/components/schemas/PlannerEventTypeKey'
            title:
              type: string
            event_date:
              type: string
              format: date
            event_end_date:
              type: string
              format: date
            status:
              $ref: '#/components/schemas/PlannerProjectStatus'
            is_sample:
              type: boolean
            target_budget:
              type: integer
              format: int64
            total_estimate:
              type: integer
              format: int64
            total_paid:
              type: integer
              format: int64
            total_tasks:
              type: integer
            completed_tasks:
              type: integer
            guest_pax_count:
              type: integer
            metadata:
              type: object
              additionalProperties: true
    PlannerProjectLite:
      type: object
      description: Project switcher row, without aggregates.
      properties:
        id:
          type: string
          format: uuid
        event_type:
          $ref: '#/components/schemas/PlannerEventTypeKey'
        title:
          type: string
        event_date:
          type: string
          format: date
        event_end_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/PlannerProjectStatus'
        is_sample:
          type: boolean
        days_remaining:
          type: integer
        phase:
          type: string
          enum: [upcoming, ongoing, finished]
    PlannerPortfolioSummary:
      type: object
      properties:
        active_count:
          type: integer
          description: The sample project is never counted in any number.
        completed_count:
          type: integer
        archived_count:
          type: integer
        combined_target_budget:
          type: integer
          format: int64
          description: Sum of `target_budget` of the active, non-sample projects.
        nearest_project:
          allOf:
            - $ref: '#/components/schemas/PlannerProjectCard'
          description: Active, non-sample, not `finished`, earliest `event_date`; absent when none.
        projects:
          type: array
          description: All projects including the sample; tabs, categories and search are filtered by the client.
          items:
            $ref: '#/components/schemas/PlannerProjectCard'
    PlannerSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scope_key:
          type: string
          pattern: '^[a-z0-9_]{1,40}$'
          description: Generated by the server from the name; never changes.
        name:
          type: string
        icon:
          type: string
        is_system:
          type: boolean
          description: True only for `all` ("Umum / Semua Sesi"), which cannot be changed or deleted.
        sort_order:
          type: integer
        session_date:
          type: string
          format: date
        start_time:
          type: string
          example: '07:30'
        end_time:
          type: string
          example: '09:00'
        location_name:
          type: string
    PlannerSessionUsage:
      type: object
      description: Rows that point at the session.
      properties:
        tasks:
          type: integer
        vendors:
          type: integer
        budget_items:
          type: integer
        scenario_items:
          type: integer
        shopping_items:
          type: integer
        guests:
          type: integer
        agendas:
          type: integer
    PlannerSessionWithUsage:
      allOf:
        - $ref: '#/components/schemas/PlannerSession'
        - type: object
          properties:
            usage:
              $ref: '#/components/schemas/PlannerSessionUsage'
    PlannerSessionRequest:
      type: object
      required: [name]
      description: >-
        Used by POST and PUT. PUT replaces the session: optional fields that are not sent are
        cleared, so a form must send all of them.
      properties:
        name:
          type: string
          description: Trimmed; 1 to 100 characters; unique in the project, case-insensitively.
        icon:
          type: string
          description: 1 to 8 characters; default 📋.
        session_date:
          type: string
          format: date
        start_time:
          type: string
          description: '"HH:MM" or "HH.MM".'
        end_time:
          type: string
        location_name:
          type: string
          maxLength: 150
    PlannerDashboard:
      type: object
      description: >-
        Each widget is `null` when the module that fills it is not built or registered, an
        `{error}` object when its provider failed, or the module's summary. The summaries are
        defined by the owning modules; their fields are listed in PLANNER_SPEC/01_DASHBOARD/BE.md §5.1.
      properties:
        server_time:
          type: string
          format: date-time
          description: For correcting the device clock on a seconds countdown.
        project:
          allOf:
            - $ref: '#/components/schemas/PhaseInfo'
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                event_type:
                  $ref: '#/components/schemas/PlannerEventTypeKey'
                title:
                  type: string
                event_date:
                  type: string
                  format: date
                event_end_date:
                  type: string
                  format: date
                  nullable: true
                status:
                  $ref: '#/components/schemas/PlannerProjectStatus'
                is_sample:
                  type: boolean
                invitation_linked:
                  type: boolean
                  description: false = standalone mode.
                target_budget:
                  type: integer
                  format: int64
                savings_target:
                  type: integer
                  format: int64
                  nullable: true
                timezone:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
        sessions:
          type: array
          description: Without the system session and without `usage`.
          items:
            $ref: '#/components/schemas/PlannerSession'
        timeline:
          $ref: '#/components/schemas/PlannerWidget'
        finance:
          $ref: '#/components/schemas/PlannerWidget'
        vendors:
          $ref: '#/components/schemas/PlannerWidget'
        guests:
          $ref: '#/components/schemas/PlannerWidget'
        admin_docs:
          $ref: '#/components/schemas/PlannerWidget'
        rundown:
          $ref: '#/components/schemas/PlannerWidget'
    PlannerWidget:
      type: object
      nullable: true
      additionalProperties: true
      description: >-
        `null`, or `{"error": "internal" | "timeout"}` when the provider failed, or the summary
        object of the owning module.
    PlannerCreated:
      type: object
      properties:
        data:
          type: object
          properties:
            project:
              $ref: '#/components/schemas/PlannerProject'
            created:
              type: boolean
            applied:
              type: object
              description: Only when `created` is true. One entry per template that was applied.
              additionalProperties:
                $ref: '#/components/schemas/PlannerApplyResult'
    PlannerTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
        sub_event_scope:
          type: string
          description: '`scope_key` of a session of the project; `all` = Umum.'
          example: resepsi
        category:
          type: string
          example: Vendor
        phase_order:
          type: integer
          minimum: 1
          maximum: 20
        phase_name:
          type: string
          example: Detail Acara & Perlengkapan
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          description: Inclusive on the Gantt chart.
        duration_days:
          type: integer
          description: '`max(end_date - start_date, 1)` (the convention of the PDF), computed by the database.'
        status:
          type: string
          enum: [belum, proses, selesai]
        pic:
          type: string
        vendor_id:
          type: string
          format: uuid
          description: Omitted when the task has no vendor.
        vendor_name:
          type: string
          description: Omitted when the task has no vendor.
        vendor_wa:
          type: string
          description: Normalized WhatsApp number (62…) of the vendor; omitted when unknown.
        sort_order:
          type: integer
        notes:
          type: string
        template_key:
          type: string
          description: Omitted for custom tasks. The basis of `append` and of the manual shift.
          example: wedding.lamaran
        origin:
          type: string
          enum: [pdf, adicara, custom]
        overdue:
          type: boolean
          description: '`status != selesai` and `end_date` before today in the project''s time zone; computed by the server.'
    PlannerTaskSummary:
      type: object
      description: Counts every task of the project, never only the filtered list.
      properties:
        total:
          type: integer
        completed:
          type: integer
        in_progress:
          type: integer
        not_started:
          type: integer
        overdue:
          type: integer
    PlannerTaskList:
      type: object
      properties:
        tasks:
          type: array
          description: Always an array, in `sort_order`.
          items:
            $ref: '#/components/schemas/PlannerTask'
        summary:
          $ref: '#/components/schemas/PlannerTaskSummary'
    PlannerCreateTaskRequest:
      type: object
      required: [title, start_date, end_date]
      properties:
        title:
          type: string
          description: Trimmed, 1-255 characters, no control characters.
        sub_event_scope:
          type: string
          description: Blank = `all`. Must be a session of the project (`400 invalid_scope`).
        category:
          type: string
          maxLength: 60
          description: Blank = `Umum`.
        phase_order:
          type: integer
          description: >-
            0 or absent = follow the task with the highest `sort_order` (phase 1 in an empty
            project); otherwise 1-20, and a missing `phase_name` is copied from another task of
            that phase.
        phase_name:
          type: string
          maxLength: 100
        start_date:
          type: string
          format: date
          description: Within 1095 days before Hari-H and 365 days after the last day of the event.
        end_date:
          type: string
          format: date
          description: Not before `start_date`; same window.
        pic:
          type: string
          maxLength: 100
        vendor_id:
          type: string
          format: uuid
          nullable: true
          description: 'Must be a vendor of this project (`400 invalid_input: vendor_id`).'
        notes:
          type: string
          maxLength: 2000
          description: A line break is allowed; other control characters are not.
    PlannerUpdateTaskRequest:
      type: object
      description: >-
        Only the fields that are sent change, and only they are validated (a task whose dates fell
        outside the window can still change status).
      properties:
        title:
          type: string
        sub_event_scope:
          type: string
        category:
          type: string
        phase_order:
          type: integer
          description: >-
            Unlike `POST`, changing it does not copy `phase_name` from another task of that phase;
            send both.
        phase_name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        pic:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [belum, proses, selesai]
        vendor_id:
          type: string
          format: uuid
        clear_vendor:
          type: boolean
          description: Removes the vendor; cannot be combined with `vendor_id`.
    PlannerReorderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: >-
            Every id of the project exactly once. Missing, repeated or foreign ids answer
            `400 invalid_input: ids` and change nothing. The items get `sort_order` 1..n.
          items:
            type: string
            format: uuid
    PlannerShiftRequest:
      type: object
      required: [days]
      properties:
        days:
          type: integer
          description: Negative = earlier. Not 0; absolute value at most 1826.
    PlannerShiftResult:
      type: object
      properties:
        shifted:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerGenerateRequest:
      type: object
      required: [preset]
      properties:
        preset:
          type: string
          description: >-
            One of `templates_available.timeline_presets` of the project's event type
            (`wedding_pdf_44`, `wedding_essential_22`, `general`); otherwise `400 invalid_template`.
        include_adicara_tasks:
          type: boolean
          description: The six Adicara tasks of the wedding; ignored for `general`.
        mode:
          type: string
          enum: [append, replace_template, replace_all]
          default: append
        confirm:
          type: boolean
          description: >-
            Required for `replace_template` when a template task is not `belum` or has a vendor,
            and for `replace_all` when the project has any task (`400 invalid_input: confirm`).
    PlannerGenerateResult:
      type: object
      properties:
        created:
          type: integer
        skipped:
          type: integer
        deleted:
          type: integer
        warnings:
          type: array
          description: '`lead_time_compressed`, `lead_time_too_short`, `scope_fallback`, `budget_link_lost`.'
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerAdminDoc:
      type: object
      properties:
        id:
          type: string
          format: uuid
        document_name:
          type: string
          maxLength: 255
        subject_role:
          type: string
          description: A key of `admin_subjects` of the event type.
          example: ortu_cpw
        quantity_detail:
          type: string
          example: 2 lembar
        nominal_cost:
          type: integer
          format: int64
          description: Whole rupiah, 0 to 10^13.
        status:
          type: string
          enum: [belum, selesai]
        sort_order:
          type: integer
        notes:
          type: string
        template_key:
          type: string
          description: Omitted for custom documents.
        origin:
          type: string
          enum: [pdf, adicara, custom]
        budget_item_id:
          type: string
          format: uuid
          description: The budget line that points at this document; omitted until the cost is synced.
    PlannerAdminDocList:
      type: object
      properties:
        docs:
          type: array
          description: Always an array, in `sort_order`.
          items:
            $ref: '#/components/schemas/PlannerAdminDoc'
        summary:
          type: object
          description: Counts every document of the project, not only the filtered list.
          properties:
            total:
              type: integer
            completed:
              type: integer
    PlannerCreateAdminDocRequest:
      type: object
      required: [document_name]
      properties:
        document_name:
          type: string
          description: Trimmed, 1-255 characters.
        subject_role:
          type: string
          description: Blank = `bersama` (wedding) or `umum`. Must be a key of `admin_subjects`.
        quantity_detail:
          type: string
          maxLength: 100
        nominal_cost:
          type: integer
          format: int64
        notes:
          type: string
          maxLength: 2000
    PlannerUpdateAdminDocRequest:
      type: object
      properties:
        document_name:
          type: string
        subject_role:
          type: string
        quantity_detail:
          type: string
        nominal_cost:
          type: integer
          format: int64
        notes:
          type: string
    PlannerApplyDocsRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [append, replace_template]
          default: append
        confirm:
          type: boolean
          description: >-
            Required for `replace_template` when a template document is done or a budget line
            points at one; the response then warns `budget_link_lost`.
    PlannerSyncBudgetRequest:
      type: object
      description: The whole body is optional.
      properties:
        sub_event_scope:
          type: string
          description: >-
            Session of the budget line. Default: `akad` for the KUA fee (`wedding.pendaftaran_kua`,
            matched to the line `biaya_kua`), otherwise `all`.
    PlannerSyncBudgetResult:
      type: object
      properties:
        budget_item_id:
          type: string
          format: uuid
        created:
          type: boolean
          description: A new budget line was created (`201`).
        linked:
          type: boolean
          description: An existing line was linked to the document.
        warnings:
          type: array
          description: '`estimate_differs` when the linked line already had a different non-zero estimate; it is kept.'
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerScenarioItem:
      type: object
      required: [id, sub_event_scope, category, item_name, cost_amount, included]
      properties:
        id:
          type: string
          format: uuid
        sub_event_scope:
          type: string
          description: 'A `scope_key` of the project (`all` = the general session).'
        item_key:
          type: string
          description: >-
            Matches the item with the budget line of the same key (Smart Adjust). Absent for a
            custom item.
        category:
          type: string
        item_name:
          type: string
        cost_amount:
          type: integer
          format: int64
        included:
          type: boolean
          description: >-
            Computed: the session takes part in the simulation (`active_sub_events` empty, `all`, or
            listed).
        preset_amount:
          type: integer
          format: int64
          description: >-
            The value of this item in the preset the scenario came from (same `item_key`); the basis
            of "back to the preset value".
    PlannerScenario:
      type: object
      required:
        - id
        - name
        - total_target
        - is_active
        - active_sub_events
        - allocated
        - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        total_target:
          type: integer
          format: int64
        is_active:
          type: boolean
        active_sub_events:
          type: array
          items:
            type: string
          description: '`scope_key` of the sessions that take part; empty means every non-system session.'
        preset_key:
          type: string
          example: wedding_75jt
        allocated:
          type: integer
          format: int64
          description: 'Σ `cost_amount` of the items that are `included`.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlannerScenarioItem'
    PlannerPresetInfo:
      type: object
      required: [key, kind]
      properties:
        key:
          type: string
          example: wedding_75jt
        kind:
          type: string
          enum: [fixed, percent]
        total_target:
          type: integer
          format: int64
          description: >-
            Only for `fixed` (the wedding packages); a `percent` preset is sized by the total the
            user sends.
    PlannerScenarioList:
      type: object
      required: [scenarios, presets]
      properties:
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/PlannerScenario'
          description: 'At most 3, by `total_target`.'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/PlannerPresetInfo'
          description: 'The presets of the project''s event type (code, not data).'
    PlannerScenarioResult:
      type: object
      required: [scenario, warnings]
      properties:
        scenario:
          $ref: '#/components/schemas/PlannerScenario'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
          description: '`scope_fallback`: items of a deleted session were placed in `all`.'
    PlannerCreateScenarioRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: '1-100 characters.'
        total_target:
          type: integer
          format: int64
          description: >-
            Required without `preset_key`; for a `fixed` preset it may be left out or must equal the
            package; for a `percent` preset it is required and at least 100000.
        preset_key:
          type: string
          description: 'A key of `presets` of the event type, otherwise `400 invalid_template`.'
        active_sub_events:
          type: array
          items:
            type: string
          description: 'Non-system sessions of the project; duplicates are dropped.'
    PlannerUpdateScenarioRequest:
      type: object
      description: 'PUT: replaces the header. Omitting `active_sub_events` means every session.'
      required: [name, total_target]
      properties:
        name:
          type: string
        total_target:
          type: integer
          format: int64
          description: '1 to 10^13. Changing it does not scale the items.'
        active_sub_events:
          type: array
          items:
            type: string
    PlannerCloneScenarioRequest:
      type: object
      required: [new_name]
      properties:
        new_name:
          type: string
    PlannerLoadPresetRequest:
      type: object
      required: [preset_key]
      properties:
        preset_key:
          type: string
        total_target:
          type: integer
          format: int64
          description: >-
            A `percent` preset takes this total (default: the scenario's own); a `fixed` one must
            not differ.
        confirm:
          type: boolean
          description: Required when the scenario already has items (they are replaced).
    PlannerScenarioItemRequest:
      type: object
      required: [category, item_name]
      properties:
        sub_event_scope:
          type: string
          description: 'Blank = `all`.'
        item_key:
          type: string
          description: '`^[a-z0-9_]{1,40}$`; unique per session in the scenario (`409 conflict`).'
        category:
          type: string
        item_name:
          type: string
        cost_amount:
          type: integer
          format: int64
    PlannerUpdateScenarioItemRequest:
      type: object
      description: >-
        PUT. `item_key` never changes; sending it is `400 invalid_input: item_key`. Moving the
        item to a session that already has the key makes it keyless.
      required: [category, item_name]
      properties:
        sub_event_scope:
          type: string
        category:
          type: string
        item_name:
          type: string
        cost_amount:
          type: integer
          format: int64
    PlannerCompareRequest:
      type: object
      required: [a, b]
      properties:
        a:
          type: string
          format: uuid
        b:
          type: string
          format: uuid
    PlannerCompareRow:
      type: object
      required: [sub_event_scope, item_name, a_amount, b_amount, delta]
      properties:
        sub_event_scope:
          type: string
        item_key:
          type: string
        item_name:
          type: string
        a_amount:
          type: integer
          format: int64
        b_amount:
          type: integer
          format: int64
        delta:
          type: integer
          format: int64
          description: '`b - a`.'
    PlannerScenarioComparison:
      type: object
      required: [a, b, rows, totals]
      properties:
        a:
          type: object
          required: [id, name, total_target]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            total_target:
              type: integer
              format: int64
        b:
          type: object
          required: [id, name, total_target]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            total_target:
              type: integer
              format: int64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PlannerCompareRow'
        totals:
          type: object
          required: [a, b, delta]
          properties:
            a:
              type: integer
              format: int64
            b:
              type: integer
              format: int64
            delta:
              type: integer
              format: int64
    PlannerApplyScenarioRequest:
      type: object
      required: [scenario_id]
      properties:
        scenario_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [smart_adjust, clean_overwrite]
          default: smart_adjust
          description: >-
            `smart_adjust` changes estimates only; `clean_overwrite` deletes every budget line (and
            its payments) first.
        sync_target_budget:
          type: boolean
          description: 'Set the project''s `target_budget` to the scenario''s `total_target`.'
        sync_target_savings:
          type: boolean
          description: 'Clear the project''s `savings_target` so the savings follow the budget again.'
        confirm:
          type: string
          description: '`RESET`, required by `clean_overwrite` (not by apply-preview).'
    PlannerApplyReport:
      type: object
      required: [mode, updated, created, skipped, untouched_count, estimate_after]
      properties:
        mode:
          type: string
          enum: [smart_adjust, clean_overwrite]
        updated:
          type: array
          items:
            type: object
            required: [sub_event_scope, item_name, from, to]
            properties:
              sub_event_scope:
                type: string
              item_key:
                type: string
              item_name:
                type: string
              from:
                type: integer
                format: int64
              to:
                type: integer
                format: int64
        created:
          type: array
          items:
            type: object
            required: [sub_event_scope, item_name, amount]
            properties:
              sub_event_scope:
                type: string
              item_key:
                type: string
              item_name:
                type: string
              amount:
                type: integer
                format: int64
        skipped:
          type: array
          items:
            type: object
            required: [sub_event_scope, item_name, reason]
            properties:
              sub_event_scope:
                type: string
              item_key:
                type: string
              item_name:
                type: string
              reason:
                type: string
                enum: [rollup, unit_pricing]
          description: >-
            Lines the application leaves alone: they roll up the shopping list or are priced per
            unit.
        deleted:
          type: object
          description: '`clean_overwrite` only: what is lost.'
          required: [lines, paid_total]
          properties:
            lines:
              type: integer
            paid_total:
              type: integer
              format: int64
        untouched_count:
          type: integer
          description: 'Budget lines no scenario item pairs with; they stay as they are.'
        estimate_after:
          type: integer
          format: int64
          description: 'Σ estimate of every line after the application.'
        new_target_budget:
          type: integer
          format: int64
          description: 'Present when `sync_target_budget`.'
    PlannerContributor:
      type: object
      required: [id, name, role_label, total, entry_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role_label:
          type: string
          description: 'A key of `contributor_roles` of the event type.'
          example: groom
        total:
          type: integer
          format: int64
        entry_count:
          type: integer
    PlannerContributorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: '1-100 characters.'
        role_label:
          type: string
          description: 'A key of `contributor_roles`; blank = `other`.'
    PlannerSavingsEntry:
      type: object
      required: [id, contributor_id, contributor_name, role_label, entry_date, amount]
      properties:
        id:
          type: string
          format: uuid
        contributor_id:
          type: string
          format: uuid
        contributor_name:
          type: string
        role_label:
          type: string
        entry_date:
          type: string
          format: date
        amount:
          type: integer
          format: int64
        notes:
          type: string
    PlannerSavingsEntryRequest:
      type: object
      required: [contributor_id, entry_date, amount]
      properties:
        contributor_id:
          type: string
          format: uuid
        entry_date:
          type: string
          format: date
          description: >-
            Within Hari-H - 1095 days to the last day + 365 days. A future date is allowed and
            counts as collected.
        amount:
          type: integer
          format: int64
          description: Above 0.
        notes:
          type: string
          description: At most 2000 characters.
    PlannerMilestone:
      type: object
      required:
        - sub_event_scope
        - name
        - session_date
        - target_amount
        - secured_amount
        - is_secured
      properties:
        sub_event_scope:
          type: string
        name:
          type: string
        session_date:
          type: string
          format: date
        target_amount:
          type: integer
          format: int64
          description: 'Σ estimate of the lines of the session.'
        secured_amount:
          type: integer
          format: int64
          description: 'What the savings cover of it, filled in date order.'
        is_secured:
          type: boolean
    PlannerSavingsOverview:
      type: object
      required:
        - kpi
        - contributors
        - milestones
        - unscheduled_estimate
        - recommendation
        - matrix
        - entries
      properties:
        kpi:
          type: object
          required: [target, collected, shortfall, target_follows_budget]
          properties:
            target:
              type: integer
              format: int64
              description: '`COALESCE(savings_target, target_budget)`.'
            collected:
              type: integer
              format: int64
            shortfall:
              type: integer
              format: int64
            target_follows_budget:
              type: boolean
              description: '`savings_target` is not set.'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/PlannerContributor'
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/PlannerMilestone'
          description: 'Dated, non-system sessions in date order.'
        unscheduled_estimate:
          type: integer
          format: int64
          description: 'Σ estimate of the lines in undated sessions and in `all`: they form no milestone.'
        recommendation:
          type: object
          required: [months_left, recommended_monthly, target_date, basis]
          properties:
            months_left:
              type: integer
              description: '30-day months to `target_date`, rounded up, at least 1.'
            recommended_monthly:
              type: integer
              format: int64
              description: Rounded up to Rp 1.000.
            per_contributor:
              type: integer
              format: int64
              description: Absent while the project has no contributor.
            target_date:
              type: string
              format: date
            basis:
              type: string
              enum: [session, event_date]
        matrix:
          type: object
          description: 'Every month from the first to the last deposit, with no gap.'
          required: [months, rows]
          properties:
            months:
              type: array
              items:
                type: string
                example: '2026-02'
            rows:
              type: array
              items:
                type: object
                required: [month, by_contributor, total]
                properties:
                  month:
                    type: string
                  by_contributor:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
                    description: 'Key = contributor id; every contributor is present (0 when empty).'
                  total:
                    type: integer
                    format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PlannerSavingsEntry'
          description: 'Filtered by `contributor_id`; every other part covers the whole project.'
    PlannerBudgetLine:
      type: object
      required:
        - id
        - sub_event_scope
        - category
        - item_name
        - source
        - pricing_mode
        - estimate
        - dp_amount
        - term_1_amount
        - term_2_amount
        - paid
        - remaining
        - payment_status
        - sort_order
      properties:
        id:
          type: string
          format: uuid
        sub_event_scope:
          type: string
        category:
          type: string
        item_name:
          type: string
        item_key:
          type: string
        source:
          type: string
          enum: [template, scenario, vendor, admin_doc, manual]
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        admin_doc_id:
          type: string
          format: uuid
        rollup_source:
          type: string
          enum: [shopping]
          description: 'The estimate and `paid` come from the shopping list; the line cannot be paid here.'
        pricing_mode:
          type: string
          enum: [lump, unit]
        quantity:
          type: number
          description: 'Two decimals; `unit` mode only.'
        unit_label:
          type: string
        unit_price:
          type: integer
          format: int64
        estimate:
          type: integer
          format: int64
          description: 'Effective: from the shopping list for a rollup line.'
        dp_amount:
          type: integer
          format: int64
        term_1_amount:
          type: integer
          format: int64
        term_2_amount:
          type: integer
          format: int64
        dp_paid_at:
          type: string
          format: date
        term_1_paid_at:
          type: string
          format: date
        term_2_paid_at:
          type: string
          format: date
        dp_receipt_url:
          type: string
        term_1_receipt_url:
          type: string
        term_2_receipt_url:
          type: string
        paid:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
          description: 'Negative = overpaid.'
        payment_status:
          type: string
          enum: [unpaid, dp_paid, partial, settled]
          description: 'Computed by the database view, never stored.'
        sort_order:
          type: integer
        notes:
          type: string
    PlannerBudgetLineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlannerBudgetLine'
    PlannerBudgetItemRequest:
      type: object
      description: >-
        POST and PUT. PUT replaces the whole line; `source`, `item_key`, the document link, the
        rollup and the payments are not touched.
      required: [category, item_name]
      properties:
        sub_event_scope:
          type: string
          description: 'Blank = `all`.'
        category:
          type: string
          description: '1-60 characters.'
        item_name:
          type: string
          description: '1-150 characters.'
        vendor_id:
          type: string
          format: uuid
          description: >-
            A vendor of the project not linked to another line (`409 vendor_already_linked`). PUT:
            omitting it releases the vendor.
        pricing_mode:
          type: string
          enum: [lump, unit]
          default: lump
        initial_estimate:
          type: integer
          format: int64
          description: 'Ignored for `unit` pricing and for a rollup line.'
        quantity:
          type: number
          description: '0.01 to 1000000, two decimals; required for `unit`.'
        unit_label:
          type: string
          description: At most 30 characters.
        unit_price:
          type: integer
          format: int64
          description: 'Required for `unit`; quantity x unit_price must not exceed 10^13.'
        notes:
          type: string
          description: At most 2000 characters.
    PlannerPaymentRequest:
      type: object
      required: [payment_stage, paid_at]
      properties:
        payment_stage:
          type: string
          enum: [dp, term_1, term_2, full]
          description: >-
            `dp`, `term_1` and `term_2` replace everything in that stage. `full` pays the remainder
            into the first empty stage and ignores `amount`.
        amount:
          type: integer
          format: int64
          description: 'Above 0; required except for `full`.'
        paid_at:
          type: string
          format: date
        receipt_url:
          type: string
          description: 'http or https, at most 500 characters. Omitted = the receipt of that stage is cleared.'
    PlannerApplyTemplateRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [append, replace_template]
          default: append
        sub_event_scope:
          type: string
          description: Limit to the lines of one session.
        confirm:
          type: boolean
          description: >-
            Required for `replace_template` when a line to delete holds an estimate, a vendor, a
            document or a shopping link.
    PlannerApplyTemplateResult:
      type: object
      required: [created, skipped, deleted, warnings]
      properties:
        created:
          type: integer
        skipped:
          type: integer
        deleted:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
          description: '`scope_fallback`, `budget_link_lost`.'
    PlannerCashflowSummary:
      type: object
      required:
        - total_savings_collected
        - total_paid
        - available_cash
        - remaining_debt
        - overpaid
        - cash_deficit
      properties:
        total_savings_collected:
          type: integer
          format: int64
        total_paid:
          type: integer
          format: int64
        available_cash:
          type: integer
          format: int64
          description: 'Collected - paid; may be negative.'
        remaining_debt:
          type: integer
          format: int64
          description: 'Σ max(estimate - paid, 0).'
        overpaid:
          type: integer
          format: int64
        cash_deficit:
          type: integer
          format: int64
          description: 'max(remaining_debt - available_cash, 0).'
    PlannerMatrixRow:
      type: object
      required:
        - sub_event_scope
        - estimate
        - dp
        - term_1
        - term_2
        - rollup_paid
        - paid
        - remaining
        - overpaid
        - line_count
      properties:
        sub_event_scope:
          type: string
          description: Empty on the total row.
        estimate:
          type: integer
          format: int64
        dp:
          type: integer
          format: int64
        term_1:
          type: integer
          format: int64
        term_2:
          type: integer
          format: int64
        rollup_paid:
          type: integer
          format: int64
        paid:
          type: integer
          format: int64
          description: 'dp + term_1 + term_2 + rollup_paid.'
        remaining:
          type: integer
          format: int64
        overpaid:
          type: integer
          format: int64
        line_count:
          type: integer
    PlannerBudgetMatrix:
      type: object
      required: [kpi, rows, total, active_scenario]
      properties:
        kpi:
          type: object
          required:
            - total_estimate
            - total_paid
            - total_remaining
            - total_overpaid
            - line_count
            - line_status
          properties:
            total_estimate:
              type: integer
              format: int64
            total_paid:
              type: integer
              format: int64
            total_remaining:
              type: integer
              format: int64
            total_overpaid:
              type: integer
              format: int64
            line_count:
              type: integer
            line_status:
              type: object
              description: Lines with an estimate above 0.
              required: [settled, partial, unpaid]
              properties:
                settled:
                  type: integer
                partial:
                  type: integer
                unpaid:
                  type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PlannerMatrixRow'
          description: 'One per session that has lines, in session order, `all` last.'
        total:
          $ref: '#/components/schemas/PlannerMatrixRow'
        active_scenario:
          type: object
          nullable: true
          description: '`null` while no scenario is active.'
          required: [id, name, total_target, unallocated]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            total_target:
              type: integer
              format: int64
            unallocated:
              type: integer
              format: int64
              description: '`total_target` - Σ estimate; negative = over the ceiling.'
    PlannerLinePayment:
      type: object
      description: >-
        The effective figures of one budget line (the view `planner_budget_lines`): read from the
        line that points at the vendor, or, for a limit group, from the line the group shares.
      required: [budget_item_id, item_name, estimate, paid, remaining, payment_status]
      properties:
        budget_item_id:
          type: string
          format: uuid
        item_name:
          type: string
        estimate:
          type: integer
          format: int64
          description: 'effective (from the shopping list when the line rolls up)'
        paid:
          type: integer
          format: int64
        remaining:
          type: integer
          format: int64
          description: '< 0 = overpaid'
        payment_status:
          type: string
          enum: [unpaid, dp_paid, partial, settled]
    PlannerVendor:
      type: object
      description: >-
        A vendor with its limit and, when a budget line points at it, the payment of that line.
        `budget_limit` is never stored for a scenario limit: it is read from the active scenario
        every time.
      required: [id, sub_event_scope, category_key, category_label, vendor_name, budget_limit, limit_source, agreed_price, status, sort_order]
      properties:
        id:
          type: string
          format: uuid
        sub_event_scope:
          type: string
        category_key:
          type: string
        category_label:
          type: string
        vendor_name:
          type: string
        pic_name:
          type: string
        phone_number:
          type: string
        formatted_wa_number:
          type: string
          description: '62…; the wa.me link is built by the client'
        portfolio_url:
          type: string
        budget_limit:
          type: integer
          format: int64
          description: 'effective limit; 0 when `limit_source` is group or none'
        limit_source:
          type: string
          enum: [manual, scenario, group, none]
        limit_group:
          type: string
          description: 'item_key of the group when `limit_source` is group'
        agreed_price:
          type: integer
          format: int64
          description: '0 = no offer yet'
        price_delta:
          type: integer
          format: int64
          description: '`budget_limit` − `agreed_price` (positive = saving); absent when either is 0 or `limit_source` is group/none'
        status:
          type: string
          enum: [rencana, negosiasi, fix, batal]
        notes:
          type: string
        sort_order:
          type: integer
        payment:
          $ref: '#/components/schemas/PlannerLinePayment'
    PlannerLimitGroup:
      type: object
      description: >-
        One scenario line that several vendor categories share (wedding: `venue_dekor`,
        `rias_busana`, `hiburan`), compared with what their vendors ask.
      required: [item_key, sub_event_scope, limit, total_agreed, members, priced, vendor_ids]
      properties:
        item_key:
          type: string
        sub_event_scope:
          type: string
          description: 'session of the scenario line (may be ''all'')'
        limit:
          type: integer
          format: int64
        total_agreed:
          type: integer
          format: int64
          description: 'Σ `agreed_price` of the members that are not cancelled (offers and deals)'
        delta:
          type: integer
          format: int64
          description: '`limit` − `total_agreed`; absent while no member has an offer'
        members:
          type: integer
        priced:
          type: integer
          description: 'members with `agreed_price` > 0'
        vendor_ids:
          type: array
          items:
            type: string
            format: uuid
        line:
          $ref: '#/components/schemas/PlannerLinePayment'
    PlannerVendorCategoryState:
      type: object
      description: >-
        One category of the checklist: the categories of the event type, then the custom ones in
        use.
      required: [key, label, state, vendors, custom, skipped]
      properties:
        key:
          type: string
        label:
          type: string
        state:
          type: string
          enum: [fix, pipeline, empty]
        vendors:
          type: integer
          description: 'not cancelled'
        custom:
          type: boolean
          description: 'not in the registry of the event type'
        skipped:
          type: boolean
          description: 'listed in planner_projects.skipped_vendor_categories'
    PlannerVendorKPI:
      type: object
      description: >-
        Always the whole project; skipped categories are left out of `categories_total`.
      required: [categories_total, categories_fixed, skipped, fixed_vendors, pipeline, fixed_total, pipeline_offers, groups_total, groups_over]
      properties:
        categories_total:
          type: integer
          description: 'registry ∪ custom categories in use, without the skipped ones'
        categories_fixed:
          type: integer
          description: 'of those, with at least one fixed vendor'
        skipped:
          type: integer
        fixed_vendors:
          type: integer
        pipeline:
          type: integer
          description: 'planned + negotiating'
        fixed_total:
          type: integer
          format: int64
        pipeline_offers:
          type: integer
          format: int64
          description: 'Σ `agreed_price` (> 0) of planned and negotiating vendors'
        groups_total:
          type: integer
        groups_over:
          type: integer
          description: 'groups with `delta` < 0'
    PlannerVendorOverview:
      type: object
      description: >-
        `kpi`, `categories` and `limit_groups` always describe the whole project; `vendors` is
        filtered by the query.
      required: [kpi, categories, limit_groups, vendors]
      properties:
        kpi:
          $ref: '#/components/schemas/PlannerVendorKPI'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PlannerVendorCategoryState'
          description: 'idem'
        limit_groups:
          type: array
          items:
            $ref: '#/components/schemas/PlannerLimitGroup'
          description: 'idem'
        vendors:
          type: array
          items:
            $ref: '#/components/schemas/PlannerVendor'
          description: 'filtered by ?scope=&status=&category='
    PlannerVendorRequest:
      type: object
      description: >-
        POST and PUT. PUT replaces the vendor entirely: `pic_name`, `phone_number`, `portfolio_url`
        and `notes` that are not sent are cleared, and `budget_limit` 0 means "follow the active
        scenario".
      required: [vendor_name]
      properties:
        sub_event_scope:
          type: string
        category_key:
          type: string
        category_label:
          type: string
        vendor_name:
          type: string
        pic_name:
          type: string
        phone_number:
          type: string
        portfolio_url:
          type: string
        budget_limit:
          type: integer
          format: int64
          description: '0 = follow the active scenario'
        agreed_price:
          type: integer
          format: int64
        status:
          type: string
          enum: [rencana, negosiasi, fix, batal]
        notes:
          type: string
    PlannerVendorStatusRequest:
      type: object
      description: >-
        One-click pipeline move. `fix` needs `agreed_price` above 0.
      required: [status]
      properties:
        status:
          type: string
          enum: [rencana, negosiasi, fix, batal]
    PlannerVendorResult:
      type: object
      description: >-
        `warnings`: `estimate_differs` (PUT, the deal moved away from the estimate of the linked
        line), `budget_link_released` (the vendor left `fix`).
      required: [vendor, warnings]
      properties:
        vendor:
          $ref: '#/components/schemas/PlannerVendor'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerLockDealRequest:
      type: object
      description: >-
        The vendor becomes `fix` with the agreed price; with `sync_to_budget_items` the deal is also
        tied to the budget.
      required: [agreed_price]
      properties:
        agreed_price:
          type: integer
          format: int64
        sync_to_budget_items:
          type: boolean
    PlannerSharedItem:
      type: object
      description: >-
        A budget line that several categories share. It is not linked to the vendor and its estimate
        is not changed.
      required: [item_key, item_name, plan, total_agreed]
      properties:
        item_key:
          type: string
        item_name:
          type: string
          description: 'name of the line, or of the scenario line when there is no budget line yet'
        budget_item_id:
          type: string
          format: uuid
          description: 'absent when there is no budget line yet'
        plan:
          type: integer
          format: int64
          description: 'effective estimate of the line, or the scenario amount when there is no line'
        total_agreed:
          type: integer
          format: int64
    PlannerLockDealResult:
      type: object
      description: >-
        `warnings`: `shared_budget_item`, `unit_pricing`.
      required: [vendor, created, warnings]
      properties:
        vendor:
          $ref: '#/components/schemas/PlannerVendor'
        budget_item_id:
          type: string
          format: uuid
          description: 'the line that was linked or created'
        created:
          type: boolean
          description: 'a new line was made'
        shared_item:
          $ref: '#/components/schemas/PlannerSharedItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerShoppingItem:
      type: object
      description: >-
        `quantity` and the prices are per unit; the totals are `round(quantity x price)`, computed
        by the database.
      required: [id, sub_event_scope, category, item_name, quantity, estimated_price, actual_price, estimated_total, actual_total, status, sort_order]
      properties:
        id:
          type: string
          format: uuid
        sub_event_scope:
          type: string
        category:
          type: string
        item_name:
          type: string
        quantity:
          type: number
          description: 'two decimals'
        unit:
          type: string
        estimated_price:
          type: integer
          format: int64
          description: 'per unit'
        actual_price:
          type: integer
          format: int64
          description: 'per unit; 0 = not bought yet'
        estimated_total:
          type: integer
          format: int64
          description: 'round(`quantity` × `estimated_price`), computed by the database'
        actual_total:
          type: integer
          format: int64
        price_delta:
          type: integer
          format: int64
          description: '`estimated_total` − `actual_total` (positive = saving); absent while `actual_price` is 0'
        purchase_location:
          type: string
        vendor_id:
          type: string
          format: uuid
        vendor_name:
          type: string
        budget_item_id:
          type: string
          format: uuid
          description: 'the rollup line; absent when the item is not rolled up'
        purpose:
          type: string
          enum: [souvenir]
        status:
          type: string
          enum: [belum, proses, selesai]
        sort_order:
          type: integer
        template_key:
          type: string
        notes:
          type: string
    PlannerShoppingKPI:
      type: object
      description: >-
        Always the whole project.
      required: [estimated_total, actual_total, done, in_progress, not_started, total]
      properties:
        estimated_total:
          type: integer
          format: int64
          description: 'Σ `estimated_total` of every item'
        actual_total:
          type: integer
          format: int64
          description: 'Σ `actual_total` of the finished items'
        done:
          type: integer
        in_progress:
          type: integer
        not_started:
          type: integer
        total:
          type: integer
        souvenir_stock:
          type: integer
          format: int64
          description: 'floor(Σ `quantity`) of the finished souvenir items; absent when no item is a souvenir'
    PlannerRollupLine:
      type: object
      description: >-
        A budget line whose estimate and paid total are computed from the shopping list.
      required: [budget_item_id, item_name, sub_event_scope, estimate, paid, linked_items]
      properties:
        budget_item_id:
          type: string
          format: uuid
        item_name:
          type: string
        sub_event_scope:
          type: string
        estimate:
          type: integer
          format: int64
        paid:
          type: integer
          format: int64
        linked_items:
          type: integer
    PlannerRollupTarget:
      type: object
      description: >-
        The line behind the button "compute the line from this list": the default line of the event
        type, the fallback line `perlengkapan` when the default one is held by a vendor, a document
        or a unit price, or the line that would be made.
      required: [item_key, item_name, sub_event_scope, rollup, has_payments, estimate, paid]
      properties:
        budget_item_id:
          type: string
          format: uuid
          description: 'absent when the line does not exist yet: it will be created'
        item_key:
          type: string
        item_name:
          type: string
        sub_event_scope:
          type: string
        rollup:
          type: boolean
          description: 'already computed from the shopping list'
        has_payments:
          type: boolean
          description: 'stored payments > 0: switching it on needs confirm'
        estimate:
          type: integer
          format: int64
        paid:
          type: integer
          format: int64
    PlannerShoppingOverview:
      type: object
      description: >-
        `kpi`, `rollups` and `default_target` describe the whole project; `items` is filtered by the
        query.
      required: [kpi, rollups, default_target, items]
      properties:
        kpi:
          $ref: '#/components/schemas/PlannerShoppingKPI'
        rollups:
          type: array
          items:
            $ref: '#/components/schemas/PlannerRollupLine'
        default_target:
          $ref: '#/components/schemas/PlannerRollupTarget'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlannerShoppingItem'
          description: 'filtered by ?scope=&category=&status='
    PlannerShoppingItemRequest:
      type: object
      description: >-
        POST. `budget_item_id` (optional) is a line that already rolls up the list; PUT never
        changes the link.
      required: [category, item_name]
      properties:
        sub_event_scope:
          type: string
        category:
          type: string
        item_name:
          type: string
        quantity:
          type: number
          description: 'empty = 1'
        unit:
          type: string
        estimated_price:
          type: integer
          format: int64
        actual_price:
          type: integer
          format: int64
        purchase_location:
          type: string
        vendor_id:
          type: string
          format: uuid
        budget_item_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [souvenir]
        status:
          type: string
          enum: [belum, proses, selesai]
        notes:
          type: string
    PlannerUpdateShoppingItemRequest:
      type: object
      description: >-
        PUT replaces the item, except the rollup link, the template key and the order.
      required: [category, item_name]
      properties:
        sub_event_scope:
          type: string
        category:
          type: string
        item_name:
          type: string
        quantity:
          type: number
        unit:
          type: string
        estimated_price:
          type: integer
          format: int64
        actual_price:
          type: integer
          format: int64
        purchase_location:
          type: string
        vendor_id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [souvenir]
        status:
          type: string
          enum: [belum, proses, selesai]
        notes:
          type: string
    PlannerShoppingStatusRequest:
      type: object
      description: >-
        Finishing an item whose actual price is 0 copies the estimate into it.
      required: [status]
      properties:
        status:
          type: string
          enum: [belum, proses, selesai]
    PlannerShoppingTemplateRequest:
      type: object
      description: >-
        `append` (the default) adds the items whose `template_key` is not there yet.
        `replace_template` first deletes every template item; it needs `confirm` when one of them
        carries work of the user.
      properties:
        mode:
          type: string
          enum: [append, replace_template]
        confirm:
          type: boolean
    PlannerShoppingTemplateResult:
      type: object
      description: >-
        `warnings`: `budget_link_lost`.
      required: [created, skipped, deleted, warnings]
      properties:
        created:
          type: integer
        skipped:
          type: integer
        deleted:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerLinkToBudgetRequest:
      type: object
      description: >-
        Both ids are optional: no `budget_item_id` = the default line; no `item_ids` = every item
        that is not linked to a line yet.
      properties:
        budget_item_id:
          type: string
          format: uuid
          description: 'empty = the default line of the registry (`default_target`)'
        item_ids:
          type: array
          items:
            type: string
            format: uuid
          description: 'empty = every item that is not linked to another rollup line'
        confirm:
          type: boolean
    PlannerLinkToBudgetResult:
      type: object
      required: [line, created, linked]
      properties:
        line:
          $ref: '#/components/schemas/PlannerRollupLine'
        created:
          type: boolean
          description: 'the line did not exist and was made'
        linked:
          type: integer
          description: 'items that were linked now'
    PlannerUnlinkFromBudgetRequest:
      type: object
      required: [budget_item_id]
      properties:
        budget_item_id:
          type: string
          format: uuid
    PlannerUnlinkFromBudgetResult:
      type: object
      required: [unlinked]
      properties:
        unlinked:
          type: integer
    PlannerGuestSide:
      type: object
      required: [key, label, invitations, pax]
      properties:
        key:
          type: string
          nullable: true
          description: '`null` = the side is not decided yet.'
        label:
          type: string
        invitations:
          type: integer
        pax:
          type: integer
    PlannerRSVPSummary:
      type: object
      description: >-
        The four answers add up to the number of guests. Also the `rsvp` of the `guests` widget of the dashboard.
      required: [attending, declined, maybe, unconfirmed, attending_pax]
      properties:
        attending:
          type: integer
        declined:
          type: integer
        maybe:
          type: integer
        unconfirmed:
          type: integer
        attending_pax:
          type: integer
          description: pax_actual of the attending guests, or pax_count where it is still 0
    PlannerGuest:
      type: object
      description: >-
        Optional keys are left out when empty; there is no `null` in a guest.
      required: [id, name, category, sub_event_scope, pax_count, invitation_sent_status, rsvp_status, pax_actual, qr_code_token, is_checked_in, souvenir_received]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        guest_side:
          type: string
          description: A key of `guest_sides` of the event type; absent = not decided yet.
        category:
          type: string
          description: A key of `guest_categories`, `lainnya`, or free text.
          example: teman_ortu
        sub_event_scope:
          type: string
          description: '`scope_key` of a session of the project; `all` = Umum.'
          example: resepsi
        table_number:
          type: string
        pax_count:
          type: integer
          minimum: 1
          maximum: 20
        phone_number:
          type: string
          description: As typed.
        formatted_wa_number:
          type: string
          description: The 62... form; the wa.me link is built by the client.
          example: '6281200000101'
        personalized_url:
          type: string
          description: >-
            `{PUBLIC_BASE_URL}/i/{slug}?g={token}&to={name}`. Only when the project is linked to an invitation; the
            invitation module does not exist yet, so it is never sent today.
        invitation_sent_status:
          type: string
          enum: [unsent, sent, delivered]
          description: '`delivered` is written by the invitation module only.'
        invitation_sent_at:
          type: string
          format: date-time
        rsvp_status:
          type: string
          enum: [unconfirmed, attending, declined, maybe]
        pax_actual:
          type: integer
          description: >-
            The head-count of an attending answer (0 = follow `pax_count`), then the head-count at the door after a
            check-in. Always 0 for the other answers.
        rsvp_submitted_at:
          type: string
          format: date-time
        qr_code_token:
          type: string
          description: The ticket, 32 hex characters. Whoever holds it can RSVP and be checked in as this guest.
          example: 0123456789abcdef0123456789abcdef
        is_checked_in:
          type: boolean
        checked_in_at:
          type: string
          format: date-time
        souvenir_received:
          type: boolean
        notes:
          type: string
    PlannerGuestCategoryCount:
      type: object
      required: [key, label, invitations, pax]
      properties:
        key:
          type: string
        label:
          type: string
        custom:
          type: boolean
          description: not a category of the event type's registry (`lainnya` and free text)
        invitations:
          type: integer
        pax:
          type: integer
    PlannerGuestSideCategory:
      type: object
      description: >-
        One cell of the side x category table of the PDF (p. 13); only the cells that hold a guest.
      required: [side, category, invitations, pax]
      properties:
        side:
          type: string
          nullable: true
          description: '`null` = the side is not decided yet.'
        category:
          type: string
        invitations:
          type: integer
        pax:
          type: integer
    PlannerGuestInvitationCounts:
      type: object
      required: [sent, unsent]
      properties:
        sent:
          type: integer
          description: sent + delivered
        unsent:
          type: integer
    PlannerGuestOverview:
      type: object
      description: >-
        Always the whole project, whatever the filter, the search or the page. No percentages: the client divides.
      required: [total, total_pax, sides, categories, side_categories, invitation, rsvp]
      properties:
        total:
          type: integer
        total_pax:
          type: integer
        sides:
          description: Every side of the registry (also at 0), a side the registry does not know if it holds data, then "Belum ditentukan" if guests have no side. Empty for a type without sides.
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestSide'
        categories:
          description: Every category of the registry (also at 0), then `lainnya` and free text that guests use, alphabetically.
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestCategoryCount'
        side_categories:
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestSideCategory'
        invitation:
          $ref: '#/components/schemas/PlannerGuestInvitationCounts'
        rsvp:
          $ref: '#/components/schemas/PlannerRSVPSummary'
    PlannerGuestList:
      type: object
      required: [overview, guests, total, limit, offset]
      properties:
        overview:
          $ref: '#/components/schemas/PlannerGuestOverview'
        guests:
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuest'
        total:
          type: integer
          description: guests that match the filters (for the pager), not `overview.total`
        limit:
          type: integer
        offset:
          type: integer
    PlannerReceptionKPI:
      type: object
      required: [checked_in_guests, expected_guests, pending_guests, actual_pax, expected_pax, souvenir_distributed]
      properties:
        checked_in_guests:
          type: integer
        expected_guests:
          type: integer
          description: guests who have not declined, plus those who declined but came
        pending_guests:
          type: integer
          description: expected_guests - checked_in_guests; never negative
        actual_pax:
          type: integer
        expected_pax:
          type: integer
        souvenir_distributed:
          type: integer
        souvenir_stock:
          type: integer
          description: floor of the quantity of the finished shopping items marked souvenir (menu 04); absent when none is marked
    PlannerReceptionFilters:
      type: object
      required: [all, checked_in, pending, categories]
      properties:
        all:
          type: integer
        checked_in:
          type: integer
        pending:
          type: integer
        categories:
          description: Expected guests only; `pax` is 0.
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestCategoryCount'
    PlannerReceptionOverview:
      type: object
      description: >-
        One packet for one polling cycle of 5 seconds.
      required: [kpi, filters, recent_checkins, guests, total, limit, offset]
      properties:
        kpi:
          $ref: '#/components/schemas/PlannerReceptionKPI'
        filters:
          $ref: '#/components/schemas/PlannerReceptionFilters'
        recent_checkins:
          description: At most 10, newest first.
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuest'
        guests:
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuest'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    PlannerCateringProjection:
      type: object
      required: [confirmed_pax, potential_pax, declined_pax, recommended_portions, attending_guests, declined_guests, maybe_guests, pending_guests, buffer_percent, buffer_pax]
      properties:
        confirmed_pax:
          type: integer
          description: attending guests only
        potential_pax:
          type: integer
          description: maybe + unconfirmed (not part of the recommendation)
        declined_pax:
          type: integer
        recommended_portions:
          type: integer
          description: ceil(confirmed_pax x (100 + buffer_percent) / 100) + buffer_pax, in integer arithmetic
        attending_guests:
          type: integer
        declined_guests:
          type: integer
        maybe_guests:
          type: integer
        pending_guests:
          type: integer
          description: unconfirmed
        buffer_percent:
          type: integer
        buffer_pax:
          type: integer
    PlannerGuestRequest:
      type: object
      description: >-
        POST and PUT. PUT replaces these fields: what is not sent is cleared (the RSVP, the invitation status, the check-in, the souvenir, the ticket and the order never change).
      required: [name, pax_count]
      properties:
        name:
          type: string
          description: Required; trimmed, double spaces folded; at most 255 characters.
        guest_side:
          type: string
          nullable: true
          description: A key (or label) of `guest_sides`; empty = not decided yet. An event type without sides refuses any value.
        category:
          type: string
          description: A key or label of `guest_categories`; any other text (60 characters at most) is a free-text category; empty = `lainnya`.
        sub_event_scope:
          type: string
          description: A session of the project; empty = `all`. An unknown one answers `invalid_scope`.
        table_number:
          type: string
          nullable: true
          description: At most 30 characters.
        pax_count:
          type: integer
          minimum: 1
          maximum: 20
        phone_number:
          type: string
          nullable: true
          description: At most 40 characters; an Indonesian number (08..., +62..., 62...), kept as typed. Another number answers `invalid_phone`.
        notes:
          type: string
          nullable: true
          description: At most 2000 characters; line breaks allowed.
    PlannerGuestSentStatusRequest:
      type: object
      required: [sent_status]
      properties:
        sent_status:
          type: string
          enum: [unsent, sent]
    PlannerGuestRSVPRequest:
      type: object
      required: [rsvp_status]
      properties:
        rsvp_status:
          type: string
          enum: [unconfirmed, attending, declined, maybe]
        pax_actual:
          type: integer
          minimum: 0
          maximum: 20
          description: Only for `attending` (0 = follow `pax_count`); stored as 0 for the other answers.
    PlannerGuestScanRequest:
      type: object
      required: [qr_code_token]
      properties:
        qr_code_token:
          type: string
    PlannerGuestCheckinRequest:
      type: object
      required: [pax_actual]
      properties:
        pax_actual:
          type: integer
          minimum: 1
          maximum: 20
        souvenir_received:
          type: boolean
    PlannerGuestSouvenirRequest:
      type: object
      required: [souvenir_received]
      properties:
        souvenir_received:
          type: boolean
    PlannerWalkInRequest:
      type: object
      required: [name, pax_actual]
      properties:
        name:
          type: string
        guest_side:
          type: string
          nullable: true
        category:
          type: string
        table_number:
          type: string
          nullable: true
        pax_actual:
          type: integer
          minimum: 1
          maximum: 20
          description: also becomes `pax_count`
        souvenir_received:
          type: boolean
        notes:
          type: string
          nullable: true
    PlannerGuestImportRequest:
      type: object
      required: [filename, content_base64]
      properties:
        filename:
          type: string
          description: Ends in `.csv` or `.xlsx`.
          example: tamu.xlsx
        content_base64:
          type: string
          description: The file, standard base64. 5 MiB at most once decoded (the body at most 7.5 MiB); the content must match the extension.
    PlannerGuestImportRowError:
      type: object
      required: [row, field, reason]
      properties:
        row:
          type: integer
          description: line in the file; the header is row 1
        field:
          type: string
        reason:
          type: string
    PlannerGuestImportDuplicate:
      type: object
      required: [row, name]
      properties:
        row:
          type: integer
        name:
          type: string
        of_row:
          type: integer
          description: same name and number as an earlier row of this file
        of_guest:
          type: string
          format: uuid
          description: same name and number as a guest that already exists
    PlannerGuestImportPreviewRow:
      type: object
      required: [row, name, category, sub_event_scope, pax_count]
      properties:
        row:
          type: integer
        name:
          type: string
        guest_side:
          type: string
        category:
          type: string
        sub_event_scope:
          type: string
        table_number:
          type: string
        pax_count:
          type: integer
        formatted_wa_number:
          type: string
    PlannerGuestImportResult:
      type: object
      description: >-
        A dry run reports what would happen and writes nothing (`created` is 0). A real import is one transaction.
      required: [dry_run, total_rows, valid_rows, invalid_rows, created, skipped, errors, duplicates, preview]
      properties:
        dry_run:
          type: boolean
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        created:
          type: integer
        skipped:
          type: integer
          description: invalid rows and duplicates that were left out
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestImportRowError'
        duplicates:
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestImportDuplicate'
        preview:
          description: At most the first 5 valid rows.
          type: array
          items:
            $ref: '#/components/schemas/PlannerGuestImportPreviewRow'
    PlannerRundownVendor:
      type: object
      description: >-
        The vendor of menu 04 that is in charge of an agenda; the WhatsApp link is built by the client from `formatted_wa_number`.
      required: [id, vendor_name, category_label]
      properties:
        id:
          type: string
          format: uuid
        vendor_name:
          type: string
        category_label:
          type: string
        pic_name:
          type: string
        phone_number:
          type: string
        formatted_wa_number:
          type: string
          description: The number in the `62…` form.
          example: "6281234567890"
    PlannerRundown:
      type: object
      description: >-
        One agenda. Optional keys are left out when empty (an open agenda has no `end_time` and no `duration_minutes`); there is no `null`.
        `duration_minutes` is the difference of the two clock times (plus a day when `ends_next_day`), not the length counted with the PDF's "+1".
      required: [id, session_id, session_name, session_icon, scope_key, start_time, ends_next_day, activity_name, pic_name, description, highlights, status, linked_songs, sort_order]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        session_name:
          type: string
        session_icon:
          type: string
        scope_key:
          type: string
        start_time:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          example: "07:46"
        end_time:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          description: Left out for an open agenda ("10.40 - selesai").
        ends_next_day:
          type: boolean
          description: The agenda ends after midnight (23:30 to 00:30 is 60 minutes).
        duration_minutes:
          type: integer
          description: Left out for an open agenda.
        activity_name:
          type: string
        pic_name:
          type: string
        vendor:
          $ref: '#/components/schemas/PlannerRundownVendor'
        description:
          type: string
        highlights:
          type: string
          description: One item per line, each starting with `- `.
        status:
          type: string
          enum: [pending, in_progress, completed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        linked_songs:
          type: integer
          description: The songs of the playlist that point at this agenda.
        sort_order:
          type: integer
        template_key:
          type: string
          description: Present on the agendas that came from the template.
          example: wedding.rundown_05
    PlannerRundownSession:
      type: object
      description: >-
        A non-system session of the project with the figures of its agendas; a session without agendas has zeroes and no `first_start` or `last_end`.
      required: [id, scope_key, name, icon, agenda_count, completed, in_progress, span_minutes]
      properties:
        id:
          type: string
          format: uuid
        scope_key:
          type: string
        name:
          type: string
        icon:
          type: string
        date:
          type: string
          format: date
          description: The date of the session; left out when it has none.
        agenda_count:
          type: integer
        completed:
          type: integer
        in_progress:
          type: integer
        span_minutes:
          type: integer
          description: From the first start to the latest end of the session, in minutes. Agendas that run in parallel or overlap are not added up.
        first_start:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          example: "07:46"
        last_end:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          description: The latest end (the start of an open agenda), counted across midnight.
    PlannerRundownKPI:
      type: object
      description: >-
        Always the whole project. There is no percentage: the client divides `completed` by `total_agendas`.
      required: [sessions, total_agendas, completed, in_progress, pending, total_span_minutes, distinct_pics]
      properties:
        sessions:
          type: integer
          description: Non-system sessions of the project.
        total_agendas:
          type: integer
        completed:
          type: integer
        in_progress:
          type: integer
        pending:
          type: integer
        total_span_minutes:
          type: integer
          description: The sum of the spans of the sessions.
        distinct_pics:
          type: integer
          description: The people in charge. A linked vendor counts once, otherwise the `pic_name` compared without case and padding.
    PlannerRundownOverview:
      type: object
      description: >-
        `sessions` and `kpi` always describe the whole project; `items` follow `?session_id=`.
      required: [sessions, kpi, items]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PlannerRundownSession'
        kpi:
          $ref: '#/components/schemas/PlannerRundownKPI'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlannerRundown'
    PlannerRundownLiveItem:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, in_progress, completed]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    PlannerRundownLive:
      type: object
      description: >-
        What the event-day screen polls every 5 seconds: no agenda text, only the status of each agenda.
      required: [kpi, sessions, items, server_time]
      properties:
        kpi:
          $ref: '#/components/schemas/PlannerRundownKPI'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PlannerRundownSession'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlannerRundownLiveItem'
        server_time:
          type: string
          format: date-time
          description: The server clock, in UTC, so that "running for N minutes" does not depend on the device clock.
    PlannerRundownRequest:
      type: object
      description: >-
        Replaces the agenda whole (the status only moves through the status route).
        Times: `07.46`, `7.46`, `07:46` and `7:46` are accepted and stored as `07:46`. Rules: without `end_time` the agenda is open and `ends_next_day` must be false; without `ends_next_day` the end must not be before the start; with it the end must be earlier than the start.
      properties:
        session_id:
          type: string
          format: uuid
          description: A non-system session of the project.
        start_time:
          type: string
          example: "07.46"
        end_time:
          type: string
          nullable: true
          example: "07.50"
        ends_next_day:
          type: boolean
        activity_name:
          type: string
          maxLength: 255
        pic_name:
          type: string
          maxLength: 150
        vendor_id:
          type: string
          format: uuid
          nullable: true
          description: A vendor of this project.
        description:
          type: string
          maxLength: 2000
        highlights:
          type: string
          maxLength: 2000
          description: One item per line, each starting with `- `.
    PlannerRundownStatusRequest:
      type: object
      description: >-
        Any move is allowed (the order pending, running, done is only how the screen presents it).
      properties:
        status:
          type: string
          enum: [pending, in_progress, completed]
    PlannerRundownReorderRequest:
      type: object
      description: >-
        `ids` must be exactly the agendas of the session, each once.
      properties:
        session_id:
          type: string
          format: uuid
        ids:
          type: array
          items:
            type: string
            format: uuid
    PlannerPlaylistReorderRequest:
      type: object
      description: >-
        `ids` must be exactly the songs of the project, each once.
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
    PlannerRundownTemplateRequest:
      type: object
      description: >-
        Both fields are optional: no body means `append`.
      properties:
        mode:
          type: string
          enum: [append, replace_template]
          description: >-
            `append` (default) adds what is missing. `replace_template` (agendas only) puts the template agendas that have not started back to the template, in place.
        confirm:
          type: boolean
          description: Must be true when `replace_template` resets agendas (the changes of the user to them are overwritten).
    PlannerRundownTemplateResult:
      type: object
      description: >-
        `warnings`: `scope_missing` (agendas of a session that was deleted were skipped; `count` is how many).
      required: [created, skipped, reset, kept, warnings]
      properties:
        created:
          type: integer
        skipped:
          type: integer
        reset:
          type: integer
          description: Template agendas that had not started and were put back to the template (`replace_template`).
        kept:
          type: integer
          description: Template agendas that are running or done and were not touched (`replace_template`).
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlannerNotice'
    PlannerWAExport:
      type: object
      description: >-
        The message built by the server, ready to copy into WhatsApp.
      required: [text]
      properties:
        text:
          type: string
    PlannerPlaylistAgenda:
      type: object
      description: >-
        The agenda a song is tied to, so the list needs no second request.
      required: [id, activity_name, session_name, start_time]
      properties:
        id:
          type: string
          format: uuid
        activity_name:
          type: string
        session_name:
          type: string
        start_time:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          example: "07:46"
        end_time:
          type: string
          pattern: '^[0-9]{2}:[0-9]{2}$'
          example: "07:46"
    PlannerPlaylist:
      type: object
      description: >-
        Optional keys are left out when empty; there is no `null`.
      required: [id, song_title, artist, moment_tag, audio_format, status, sort_order]
      properties:
        id:
          type: string
          format: uuid
        rundown_id:
          type: string
          format: uuid
        agenda:
          $ref: '#/components/schemas/PlannerPlaylistAgenda'
        song_title:
          type: string
        artist:
          type: string
        moment_tag:
          type: string
          description: Free text; the registry only suggests (`GET /event-types`, `moment_tags`).
        audio_format:
          type: string
          enum: [digital_playback, live_band, acoustic, sound_fx]
        spotify_url:
          type: string
        youtube_url:
          type: string
        audio_cue_notes:
          type: string
          description: Start point, fade, ducking, volume level.
        status:
          type: string
          enum: [ready, needs_review, missing_file]
        sort_order:
          type: integer
        template_key:
          type: string
    PlannerPlaylistFormatCounts:
      type: object
      required: [digital_playback, live_band, acoustic, sound_fx]
      properties:
        digital_playback:
          type: integer
        live_band:
          type: integer
        acoustic:
          type: integer
        sound_fx:
          type: integer
    PlannerPlaylistKPI:
      type: object
      description: >-
        Always the whole playlist.
      required: [total_tracks, by_format, mapped_moments, ready, needs_review, missing_file]
      properties:
        total_tracks:
          type: integer
        by_format:
          $ref: '#/components/schemas/PlannerPlaylistFormatCounts'
        mapped_moments:
          type: integer
          description: Moment tags that have a song, counted as typed ("Penutup" and "penutup" are two).
        ready:
          type: integer
        needs_review:
          type: integer
        missing_file:
          type: integer
    PlannerPlaylistOverview:
      type: object
      description: >-
        `kpi` always describes the whole playlist; `items` follow the filters.
      required: [kpi, items]
      properties:
        kpi:
          $ref: '#/components/schemas/PlannerPlaylistKPI'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlannerPlaylist'
    PlannerPlaylistRequest:
      type: object
      description: >-
        Replaces the song whole. An empty `moment_tag` becomes `Lainnya`, an empty `audio_format` `digital_playback`, an empty `status` `needs_review`; a blank link is no link.
      properties:
        rundown_id:
          type: string
          format: uuid
          nullable: true
          description: An agenda of this project.
        song_title:
          type: string
          maxLength: 255
        artist:
          type: string
          maxLength: 255
        moment_tag:
          type: string
          maxLength: 100
        audio_format:
          type: string
          enum: [digital_playback, live_band, acoustic, sound_fx]
        spotify_url:
          type: string
          description: An `http` or `https` URL of at most 2.000 characters.
        youtube_url:
          type: string
          description: An `http` or `https` URL of at most 2.000 characters.
        audio_cue_notes:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [ready, needs_review, missing_file]

  parameters:
    PlannerTaskId:
      name: taskId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown task and another project's task answer 404.
      schema:
        type: string
        format: uuid
    PlannerDocId:
      name: docId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown document and another project's document answer 404.
      schema:
        type: string
        format: uuid
    PlannerProjectId:
      name: projectId
      in: path
      required: true
      description: >-
        A canonical UUID. An id that is not a UUID, an unknown project and another user's
        project all answer 404.
      schema:
        type: string
        format: uuid
    PlannerScenarioId:
      name: scenarioId
      in: path
      required: true
      description: >-
        A canonical UUID; anything else, an unknown scenario and another project's scenario
        answer 404.
      schema:
        type: string
        format: uuid
    PlannerScenarioItemId:
      name: scenarioItemId
      in: path
      required: true
      description: A canonical UUID of an item of the scenario.
      schema:
        type: string
        format: uuid
    PlannerContributorId:
      name: contributorId
      in: path
      required: true
      description: A canonical UUID of a contributor of the project.
      schema:
        type: string
        format: uuid
    PlannerEntryId:
      name: entryId
      in: path
      required: true
      description: A canonical UUID of a deposit of the project.
      schema:
        type: string
        format: uuid
    PlannerBudgetItemId:
      name: budgetItemId
      in: path
      required: true
      description: A canonical UUID of a budget line of the project.
      schema:
        type: string
        format: uuid
    PlannerVendorId:
      name: vendorId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown vendor and another project's vendor answer 404.
      schema:
        type: string
        format: uuid
    PlannerShoppingItemId:
      name: shoppingItemId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown item and another project's item answer 404.
      schema:
        type: string
        format: uuid
    PlannerGuestId:
      name: guestId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown guest and another project's guest answer 404.
      schema:
        type: string
        format: uuid
    PlannerRundownId:
      name: rundownId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown agenda and another project's agenda answer 404.
      schema:
        type: string
        format: uuid
    PlannerPlaylistId:
      name: playlistId
      in: path
      required: true
      description: A canonical UUID; anything else, an unknown song and another project's song answer 404.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid input (see `error.code`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        Missing/invalid credentials or token. For a bearer token this also covers an account
        that was deactivated or deleted, and a token issued before the account's last password
        change; the signature alone is not enough. The code is `unauthorized` in every case
        (never 403) so that a client that signs the user out on 401 ends at the login form,
        where `account_inactive` is explained.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: >-
        Too many attempts from this client IP. The IP is read from `X-Real-IP`, and only
        when the connection comes from a trusted proxy (`TRUSTED_PROXIES`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlannerNotFound:
      description: >-
        `not_found`: the project (or session) does not exist or is not the caller's. Both look the same.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlannerConflict:
      description: >-
        `project_read_only` (the project is archived; only reopening and deleting it work) or
        `conflict` (a concurrent change; safe to retry).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

security:
  - bearerAuth: []

paths:
  /healthz:
    servers:
      - url: /
        description: Not under `/api`; Nginx serves it at the root.
    get:
      summary: Health Check
      operationId: healthCheck
      description: Liveness/Readiness probe.
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '503':
          description: Postgres cannot be reached (`error.code` = database_unavailable).

  /v1/auth/register:
    post:
      summary: Register User
      operationId: registerUser
      description: >-
        Mendaftarkan akun baru (role customer). Tidak mengembalikan token; panggil
        `/v1/auth/login` setelahnya. Dibatasi `AUTH_RATE_LIMIT` per IP per menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - username
                - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Case-insensitive, stored lowercase. Must contain a dot in the domain.
                  example: user@example.com
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[a-z0-9._]+$'
                  description: Trimmed and lowercased by the server.
                  example: myusername
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  description: At least one letter and one digit. Max is 72 *bytes* (bcrypt).
                  example: PasswordYangKuat123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: email_taken or username_taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/login:
    post:
      summary: Login User
      operationId: loginUser
      description: >-
        Masuk dengan email **atau** username (kirim salah satu; `email` dipakai jika keduanya ada).
        Dibatasi `AUTH_RATE_LIMIT` per IP per menit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                email:
                  type: string
                  example: user@example.com
                username:
                  type: string
                  example: myusername
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: account_inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/refresh:
    post:
      summary: Refresh Session
      operationId: refreshSession
      description: >-
        Menukar refresh token dengan pasangan token baru. Refresh token **dirotasi**: token yang
        dikirim langsung hangus, sehingga memakainya dua kali menghasilkan 401. Klien yang
        mengirim beberapa request bersamaan harus menyatukannya menjadi satu panggilan refresh.

        **Deteksi pencurian.** Jika token yang sudah dirotasi dikirim lagi **lebih dari 10 detik**
        setelah dirotasi, token itu dianggap bocor: respons tetap 401 dan **semua** refresh session
        pengguna dicabut (pemilik harus login ulang). Dalam 10 detik pertama hanya ditolak dengan
        401 (kemungkinan besar dua request klien yang berpacu). Token yang dicabut lewat logout atau
        ganti password tidak memicu ini. Akun yang dinonaktifkan atau sudah dihapus mendapat 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/logout:
    post:
      summary: Logout User
      operationId: logoutUser
      description: >-
        Mencabut sesi refresh token di database. Access token yang sudah terbit tetap valid
        sampai kedaluwarsa (logout tidak mengubah `password_changed_at`). Token yang sudah
        kedaluwarsa/tidak valid menghasilkan 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/password:
    post:
      summary: Change Password
      operationId: changePassword
      description: >-
        Mengubah password akun yang sedang login dan mencabut **semua** refresh session.
        Access token yang terbit sebelum perubahan ini juga langsung tidak berlaku (401),
        termasuk yang dipakai untuk memanggil endpoint ini. Token yang terbit pada detik yang
        sama dengan perubahan tetap diterima. Aturan `new_password` sama dengan register.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/me:
    get:
      summary: Get Profile
      operationId: getProfile
      description: >-
        Mengambil data profil user yang sedang login. Access token dicocokkan dengan database
        pada setiap permintaan (akun harus ada dan aktif).
      responses:
        '200':
          description: Profile data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          username:
                            type: string
                          name:
                            type: string
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update Profile
      operationId: updateProfile
      description: Mengubah nama user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Nama Baru
      responses:
        '200':
          description: Profile updated successfully (`data` = id, email, username, name)
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------- Planner (menu 01) ----------
  /v1/planner/event-types:
    get:
      tags: [Planner]
      summary: Event type registry
      operationId: plannerEventTypes
      description: >-
        The nine event types (icon, label, default sessions, metadata fields, labels) and the
        templates that can be requested for each. Static per release.
      responses:
        '200':
          description: Registry
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlannerEventType'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/planner/projects:
    get:
      tags: [Planner]
      summary: List projects (Hub cards, or the lightweight switcher list)
      operationId: plannerListProjects
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, archived, all]
            default: all
        - name: view
          in: query
          description: '`lite` returns only what the project switcher needs, without aggregates.'
          schema:
            type: string
            enum: [lite]
      responses:
        '200':
          description: >-
            Active projects first (nearest date first), then completed, then archived (latest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/PlannerProjectCard'
                        - $ref: '#/components/schemas/PlannerProjectLite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Planner]
      summary: Create a project
      operationId: plannerCreateProject
      description: >-
        Atomic: the project, its default sessions and every requested template are created in
        one transaction, or nothing is. Limited to 10 per minute per user and to
        `PLANNER_MAX_PROJECTS` (default 100) real projects per user (the sample does not count).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerInitProjectRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerCreated'
        '200':
          description: 'The `client_token` was already used; the original project, no templates re-run (`created: false`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`project_limit_reached`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: '`rate_limited`: more than 10 creations in a minute.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/summary:
    get:
      tags: [Planner]
      summary: Portfolio metrics and cards
      operationId: plannerProjectsSummary
      responses:
        '200':
          description: Metrics (the sample project is never counted) and all cards.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerPortfolioSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/planner/projects/sample:
    post:
      tags: [Planner]
      summary: Create the sample project
      operationId: plannerCreateSample
      description: >-
        "Contoh: Pernikahan Sinta & Arif", Hari-H 175 days from today, budget Rp 75.000.000. At
        most one per user and idempotent, also under concurrent requests. It receives every
        template that is available plus the dataset overlays of the modules that exist; until
        modules 02-06 are built it holds the sessions and metadata only.
      responses:
        '201':
          description: Created now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerCreated'
        '200':
          description: 'The user already had one (`created: false`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannerCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/planner/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner]
      summary: Project detail
      operationId: plannerGetProject
      responses:
        '200':
          description: >-
            `shiftable_tasks` is the number of template tasks that are not done: when it is above
            zero the client asks whether to shift them before it saves a new date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/PlannerProject'
                      shiftable_tasks:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    patch:
      tags: [Planner]
      summary: Update a project
      operationId: plannerUpdateProject
      description: >-
        Runs under a row lock. A date change also moves the sessions dated on the old Hari-H and,
        with `shift_tasks`, the unfinished template tasks, all in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerUpdateProjectRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/PlannerProject'
                      warnings:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlannerNotice'
                      hints:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlannerNotice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          $ref: '#/components/responses/PlannerConflict'
    delete:
      tags: [Planner]
      summary: Delete a project permanently
      operationId: plannerDeleteProject
      description: Removes everything under the project. Allowed on an archived project.
      parameters:
        - name: confirm
          in: query
          required: true
          description: 'Must equal the stored title exactly, else `400 invalid_input: confirm`.'
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'

  /v1/planner/projects/{projectId}/status:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    patch:
      tags: [Planner]
      summary: Change the project status
      operationId: plannerChangeStatus
      description: >-
        Any transition between `active`, `completed` and `archived`. Allowed on an archived
        project (it is how an archive is reopened).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/PlannerProjectStatus'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      project:
                        $ref: '#/components/schemas/PlannerProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'

  /v1/planner/projects/{projectId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner]
      summary: Workspace dashboard
      operationId: plannerDashboard
      description: >-
        Six widgets, each filled by one provider of another module. Providers run in parallel
        (at most 3 at once) under a 3 s deadline; one that fails, panics or is slow only
        affects its own widget. Limited to 60 requests per minute per user.
      responses:
        '200':
          description: Dashboard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '429':
          description: '`rate_limited`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/sessions:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    get:
      tags: [Planner]
      summary: List sessions
      operationId: plannerListSessions
      description: All sessions including the system session `all`, each with `usage`.
      responses:
        '200':
          description: Sessions in display order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlannerSessionWithUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
    post:
      tags: [Planner]
      summary: Create a session
      operationId: plannerCreateSession
      description: At most 20 non-system sessions per project. `scope_key` is generated from the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerSessionRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          description: '`session_name_taken`, `session_limit_reached`, `project_read_only` or `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/planner/projects/{projectId}/sessions/reorder:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
    post:
      tags: [Planner]
      summary: Reorder sessions
      operationId: plannerReorderSessions
      description: >-
        `session_ids` must list every non-system session of the project exactly once; they get
        `sort_order` 1..n and `all` stays 0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_ids]
              properties:
                session_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: All sessions in the new order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlannerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          $ref: '#/components/responses/PlannerConflict'

  /v1/planner/projects/{projectId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/PlannerProjectId'
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Planner]
      summary: Replace a session
      operationId: plannerUpdateSession
      description: >-
        Replaces name, icon, date, times and location (fields not sent are cleared).
        `scope_key` never changes. The system session cannot be modified (`400 invalid_input`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannerSessionRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PlannerSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PlannerNotFound'
        '409':
          $ref: '#/components/responses/PlannerConflict'
    delete:
      tags: [Planner]
      summary: Delete a session
      operationId: plannerDeleteSession
      description: >-
        In one transaction (under a lock on the project) everything that points at the session
        (tasks, vendors, budget items, scenario items, shopping items, guests) is moved to
        `move_to`, `active_sub_events` of scenarios is cleaned, and the session is deleted. Budget
        and scenario items whose `item_key` would collide in the target lose the key instead of
        failing; totals do not change. A session with rundown agendas needs `delete_agendas=true`.
      parameters:
        - name: move_to
          in: query
          description: '`scope_key` of the destination; default `all`. Must exist and differ from the deleted session.'
          schema:
            type: string
        - name: delete_agendas
          in: query
          schema:
            type: boolean
      responses:
        '204':
          description: Deleted.
        '400':

openapi: 3.1.0
info:
  title: Adicara API
  version: 0.3.0
  description: >-
    BACKUP, not the live contract. Describes the previous API version (cookie
    sessions, /api/v1, invitations, guests, RSVP), which no longer matches the
    backend, and is not linted by CI. The canonical contract is
    backend/docs/openapi.yaml. Kept as a reference for rebuilding the invitation
    module.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Operations
    description: Process and dependency health endpoints.
  - name: Public Invitations
    description: Public, read-only invitation delivery.
  - name: Authentication
    description: Cookie-based account and session operations.
  - name: Invitations
    description: Authenticated invitation management scoped to the current owner.
security: []
paths:
  /healthz:
    servers:
      - url: /
    get:
      operationId: getLiveness
      summary: Check whether the API process is alive
      tags: [Operations]
      responses:
        '200':
          description: API process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    servers:
      - url: /
    get:
      operationId: getReadiness
      summary: Check whether the API and database are ready
      tags: [Operations]
      responses:
        '200':
          description: API is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed.
          content:
            text/plain:
              schema:
                type: string
  /auth/register:
    post:
      operationId: register
      summary: Register an account and start a session
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. Sets the HttpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      operationId: login
      summary: Start a session with email and password
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. Sets the HttpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Authentication]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the user for the current session
      tags: [Authentication]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user and session expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /invitations:
    get:
      operationId: listInvitations
      summary: List invitations owned by the current user
      tags: [Invitations]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Owner-scoped invitation summaries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createInvitation
      summary: Create a draft invitation for the current user
      tags: [Invitations]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationWrite'
      responses:
        '201':
          description: Draft invitation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Slug is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    get:
      operationId: getInvitation
      summary: Get an invitation owned by the current user
      tags: [Invitations]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Owner-scoped invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      operationId: updateInvitation
      summary: Update invitation fields owned by the current user
      tags: [Invitations]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationUpdate'
      responses:
        '200':
          description: Updated invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Slug is already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteInvitation
      summary: Permanently delete an invitation owned by the current user
      tags: [Invitations]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Invitation deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invitations/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
      - $ref: '#/components/parameters/CSRFToken'
    post:
      operationId: publishInvitation
      summary: Publish a complete invitation owned by the current user
      tags: [Invitations]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Published invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invitations/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
      - $ref: '#/components/parameters/CSRFToken'
    post:
      operationId: unpublishInvitation
      summary: Return a published invitation to draft
      tags: [Invitations]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Draft invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invitations/{id}/guests:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
    get:
      operationId: listGuests
      summary: List guests for an owned invitation
      tags: [Invitations]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Guests including their private management fields and public tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [guests]
                properties:
                  guests:
                    type: array
                    items:
                      $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createGuest
      summary: Add a guest to an owned invitation
      tags: [Invitations]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestWrite'
      responses:
        '201':
          description: Guest created with a secure random public token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /invitations/{id}/guests/{guestId}:
    parameters:
      - $ref: '#/components/parameters/InvitationID'
      - $ref: '#/components/parameters/GuestID'
    patch:
      operationId: updateGuest
      summary: Replace editable fields for an owned invitation guest
      tags: [Invitations]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestWrite'
      responses:
        '200':
          description: Guest updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      operationId: deleteGuest
      summary: Delete a guest from an owned invitation
      tags: [Invitations]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Guest deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /public/invitations/{slug}:
    get:
      operationId: getPublishedInvitation
      summary: Get one published invitation
      description: Returns public event information only. Draft and archived invitations return 404.
      tags: [Public Invitations]
      parameters:
        - name: slug
          in: path
          required: true
          description: Lowercase, hyphen-separated public invitation slug.
          schema:
            type: string
            minLength: 3
            maxLength: 100
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      responses:
        '200':
          description: Published invitation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          description: Invalid slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Published invitation was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/invitations/{slug}/rsvp:
    post:
      operationId: submitRSVP
      summary: Submit or replace an RSVP using a personalized guest token
      tags: [Public Invitations]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 100
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RSVPWrite'
      responses:
        '200':
          description: RSVP stored idempotently for the guest.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RSVP'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: adicara_session
      description: Opaque HttpOnly session token. Only its SHA-256 hash is stored server-side.
  parameters:
    InvitationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuestID:
      name: guestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Per-session CSRF token returned after registration or login and mirrored in the non-HttpOnly adicara_csrf cookie.
      schema:
        type: string
        minLength: 32
  responses:
    BadRequest:
      description: Malformed or unsupported request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The owner-scoped resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Valid JSON failed domain validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        display_name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 128
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, csrf_token, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrf_token:
          type: string
          description: Send in X-CSRF-Token for authenticated state-changing requests. Keep in memory, not localStorage.
        expires_at:
          type: string
          format: date-time
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
    InvitationWrite:
      type: object
      additionalProperties: false
      required: [event_type, slug, title, template_key, allow_indexing, hosts, events]
      properties:
        event_type:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,49}$'
        slug:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
          minLength: 3
          maxLength: 160
        template_key:
          type: string
          enum: [editorial-ivory, botanical-modern, monochrome-luxe]
        allow_indexing:
          type: boolean
          default: false
        hosts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/InvitationHost'
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/InvitationEvent'
    InvitationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        event_type:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,49}$'
        slug:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
          minLength: 3
          maxLength: 160
        template_key:
          type: string
          enum: [editorial-ivory, botanical-modern, monochrome-luxe]
        allow_indexing:
          type: boolean
        hosts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/InvitationHost'
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/InvitationEvent'
    GuestWrite:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        group:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        notes:
          type: string
          maxLength: 500
    Guest:
      allOf:
        - $ref: '#/components/schemas/GuestWrite'
        - type: object
          additionalProperties: false
          required: [id, public_token, rsvp_status, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            public_token:
              type: string
              minLength: 43
              maxLength: 43
            rsvp_status:
              type: string
              enum: [hadir, tidak_hadir, belum_menjawab]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    RSVPWrite:
      type: object
      additionalProperties: false
      required: [guest_token, status, attendee_count]
      properties:
        guest_token:
          type: string
          minLength: 43
          maxLength: 43
        status:
          type: string
          enum: [hadir, tidak_hadir]
        attendee_count:
          type: integer
          minimum: 0
          maximum: 20
        message:
          type: string
          maxLength: 500
    RSVP:
      type: object
      additionalProperties: false
      required: [status, attendee_count, updated_at]
      properties:
        status:
          type: string
          enum: [hadir, tidak_hadir]
        attendee_count:
          type: integer
          minimum: 0
          maximum: 20
        message:
          type: string
        updated_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]
    Invitation:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - event_type
        - slug
        - title
        - template_key
        - allow_indexing
        - hosts
        - events
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, published, archived]
        event_type:
          type: string
          examples: [wedding]
        slug:
          type: string
        title:
          type: string
        template_key:
          type: string
        allow_indexing:
          type: boolean
          default: false
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/InvitationHost'
        events:
          type: array
          items:
            $ref: '#/components/schemas/InvitationEvent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvitationHost:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        role:
          type: string
          minLength: 1
          maxLength: 120
    InvitationEvent:
      type: object
      additionalProperties: false
      required: [name, start_at, timezone, venue_name, venue_address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          examples: [Asia/Jakarta]
        venue_name:
          type: string
          minLength: 1
          maxLength: 160
        venue_address:
          type: string
          minLength: 1
          maxLength: 500
        map_url:
          type: string
          format: uri
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_attempts:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_writes:10m rate=10r/m;

upstream adicara_frontend {
    server frontend:4321;
    keepalive 16;
}

upstream adicara_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 2m;

    # TLS is terminated by a reverse proxy on the host, so for every visitor
    # $remote_addr is that proxy. Without this, all rate-limit buckets (here and
    # in the backend, which reads X-Real-IP) collapse into one for the whole site.
    # X-Forwarded-For is believed only when the peer is a private or loopback
    # address; a visitor reaching nginx directly has a public address, so a
    # header they send is ignored. Of the addresses in the header, the last one
    # that is not itself trusted wins, so a client cannot prepend a fake one.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rejections from limit_req use the API's error format, so the login form
    # and API clients handle them like a rate_limited reply from the backend.
    limit_req_status 429;
    error_page 429 = @rate_limited;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        proxy_pass http://adicara_backend/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The backend has no /api prefix: it serves /v1/... . Nginx owns the prefix
    # and drops it, so the browser-facing /api/v1/... maps to /v1/... upstream.
    location /api/v1/ {
        limit_req zone=api_general burst=60 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://adicara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Credential guessing, directly against the API.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth_attempts burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://adicara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Credential guessing through the website: the login form posts to Astro
    # (/auth/login, /auth/register), which then calls the backend, so /api never
    # sees these requests and the limit has to be applied here as well.
    location ~ ^/auth/(login|register)$ {
        limit_req zone=auth_attempts burst=10 nodelay;
        proxy_pass http://adicara_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Not served yet: the invitation module is being rebuilt. Kept so the limit
    # is already in place when the endpoint comes back.
    location ~ ^/api/v1/public/invitations/[^/]+/rsvp$ {
        limit_req zone=public_writes burst=15 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://adicara_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"too many requests, try again later"}}';
    }

    location /_astro/ {
        proxy_pass http://adicara_frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://adicara_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

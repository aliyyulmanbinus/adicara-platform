name: adicara-production

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENV: production
      # Signs every access and refresh token. Required: the backend refuses to
      # start in production with a missing, short, or placeholder value.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is not set in /opt/adicara/.env - generate one with openssl rand -hex 32}"
      # Optional. Empty means "use the backend default" (see backend/README.md).
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-}
      # Same-origin traffic needs no CORS; allow only the public origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_SITE_URL}}
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/adicara-api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      API_BASE_URL: http://backend:8080
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    networks: [private]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/adicara.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [private]
    depends_on: [frontend, backend]
    restart: unless-stopped

networks:
  private:

volumes:
  postgres_data:
